</header><div class="site-header" aria-hidden="true"></div><main id="pictures" aria-label="纪实镜头介绍"><section class="picture" id="纪实镜头-01" data-initial-cover><img crossorigin="anonymous" src="https://wly0829-img-media-shanghai.cn-shanghai.oss.aliyuncs.com/releases/7f1ad9655377e3a52e329ff10d3d83bbdbb7e483120fab836aa97502c8518d69/video-scaffold/assets/%E7%BA%AA%E5%AE%9E%E9%95%9C%E5%A4%B4-01-v1.webp" data-cover-pending width="2172" height="724" alt="封面" fetchpriority="high"><h2 class="picture-title-fallback">纪实镜头</h2><p class="picture-cover-error" role="status">封面图暂时没加载出来。<br>真截图、真文件、手机屏幕和原声录音，拍成像在桌前实拍的镜头，跟着旁白一行行读下去。</p></section></main>
<dialog id="details" aria-labelledby="detail-title"><div class="detail-stage"><div class="detail-shot" title="点击图片收起"></div><aside class="drawer"><header style="--order:0"><div class="detail-meta"></div><h2 id="detail-title"></h2><div class="detail-count"></div><button id="close" type="button">收起 ×</button><i class="progress"></i></header><div class="detail-body" tabindex="0"></div></aside></div></dialog><script>(() => {
  const cover = document.querySelector('[data-initial-cover] > img');
  if (cover) {
    const root = document.documentElement;
    const pictures = document.getElementById('pictures');
    pictures.style.setProperty('--picture-scale', Math.min(1, root.clientWidth / pictures.offsetWidth));
    if (root.classList.contains('mo-cover-refresh')) {
      cover.addEventListener('animationend', () => {
        root.classList.remove('mo-cover-refresh');
        root.style.removeProperty('--mo-refresh-cover');
        cover.setAttribute('data-cover-carried', '');
      }, { once: true });
    }
    const failed = () => cover.setAttribute('data-cover-error', '');
    const show = () => cover.decode().then(() => {
      cover.removeAttribute('data-cover-pending');
      cover.removeAttribute('data-cover-error');
    }, failed);
    cover.addEventListener('load', show);
    cover.addEventListener('error', failed);
    if (cover.complete) cover.naturalWidth ? show() : failed();
  }

  const pending = [...document.querySelectorAll('script[type="application/x-project-script"]')];
  const status = document.createElement('p');
  const retry = document.createElement('button');
  status.className = 'project-load-status';
  status.setAttribute('role', 'status');
  retry.type = 'button';
  retry.textContent = '重试正文';
  status.append('正文暂时没有加载出来。', retry);

  async function load() {
    retry.disabled = true;
    while (pending.length) {
      const script = document.createElement('script');
      script.src = pending[0].dataset.src;
      const loaded = await new Promise(resolve => {
        script.onload = () => resolve(true);
        script.onerror = () => resolve(false);
        document.head.append(script);
      });
      if (!loaded) {
        script.remove();
        document.querySelector('#pictures').prepend(status);
        retry.disabled = false;
        return;
      }
      pending.shift();
    }
    status.remove();
  }

  retry.addEventListener('click', load);
  load();
})();
</script>
