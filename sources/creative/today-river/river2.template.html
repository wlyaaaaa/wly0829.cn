<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今天的河 · 小样第二版</title>
<style>
  :root {
    --title:#0a7232; --text:#2e4675; --accent:#0a7a33; --line:#bfe8cc; --soft:#edfbf3; --muted:#5d6f8f;
    --ok:#17a35e; --warn:#e3a008; --bad:#dc4433; --gray:#9aa5a0; --speed:2.5;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; background:#fff; color:var(--text); font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif; line-break:strict; }
  .wrap { max-width:1480px; margin:0 auto; padding:18px 18px 56px; }
  .crumb { font-size:13px; color:var(--accent); letter-spacing:.04em; margin:0 0 4px; }
  h1 { font-size:30px; margin:0 0 6px; color:var(--title); letter-spacing:.03em; }
  #headline { font-size:16px; line-height:1.75; margin:0; max-width:1000px; }
  #headline b { color:var(--title); font-variant-numeric:tabular-nums; }
  #headline .bad { color:#b3261a; font-weight:700; } #headline .warn { color:#8a5a00; font-weight:700; }
  .when { font-size:13px; color:var(--muted); margin:2px 0 8px; }
  .fake { margin:0 0 10px; padding:9px 14px; border-radius:10px; border:1px dashed #d39b26; background:#fff9e8; color:#7a5200; font-size:14px; line-height:1.6; }
  #alerts { display:grid; gap:6px; margin:0 0 10px; }
  .alert { font:inherit; font-size:14px; line-height:1.55; text-align:left; padding:8px 14px; border-radius:10px; border:1px solid; background:#fff; cursor:pointer; }
  .alert.bad { border-color:#f1aaa2; background:#fff4f2; color:#8f1d15; } .alert.warn { border-color:#f0d28a; background:#fffaec; color:#7a5200; }
  .alert b { margin-right:.5em; }

  /* ---------- 河 ---------- */
  #scroller { overflow-x:auto; overflow-y:hidden; margin:0 -18px; padding:0 18px; scrollbar-width:thin; }
  #stage { position:relative; width:100%; min-width:860px; aspect-ratio:var(--aspect,1.722); font-size:12px; user-select:none; -webkit-user-select:none;
           --river:url(__RIVER__); --b0:url(__BOAT0__); --b1:url(__BOAT1__); --b2:url(__BOAT2__); --b3:url(__BOAT3__); }
  #paper, #water { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #paper { background:var(--river) center/100% 100% no-repeat; display:none;
           -webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent),linear-gradient(transparent,#000 7%,#000 93%,transparent); -webkit-mask-composite:source-in;
           mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent),linear-gradient(transparent,#000 7%,#000 93%,transparent); mask-composite:intersect; }
  #stage.nogl #paper { display:block; } #stage.nogl #water { display:none; }
  #stage.stale #paper { filter:grayscale(.9) brightness(1.04); } #stage.stale #layer { filter:grayscale(.85); }
  #stage.stale .lamp .lit { background:#b9c2bd !important; box-shadow:none !important; animation:none !important; } #stage.stale .lamp .glow { opacity:0 !important; }
  #layer { position:absolute; inset:0; }
  #layer button { font-family:inherit; }
  .hint { display:none; font-size:12.5px; color:var(--muted); margin:6px 0 0; }

  /* 船 */
  .boat { position:absolute; width:calc(var(--w) * 1em); font-size:inherit; padding:0; border:0; background:none; cursor:pointer; transform:translate(-50%,-50%); -webkit-tap-highlight-color:transparent; outline:0; }
  .boat .bob { display:block; position:relative; animation:bob calc(var(--bp,15s) / var(--speed)) ease-in-out infinite; animation-delay:var(--bd,0s); }
  .boat .hull { display:block; width:100%; aspect-ratio:var(--ar); background:var(--img) center/100% 100% no-repeat; transform:rotate(var(--rot,0deg));
                filter:drop-shadow(.14em .26em .2em rgba(4,58,46,.45)); transition:filter .15s; }
  .boat:hover .hull, .boat:focus-visible .hull { filter:drop-shadow(0 0 .35em #fff) drop-shadow(.14em .26em .2em rgba(4,58,46,.45)) brightness(1.08); }
  .boat.on .hull { filter:drop-shadow(0 0 .18em #fff) drop-shadow(0 0 .5em #fff) drop-shadow(.14em .26em .2em rgba(4,58,46,.45)); }
  .boat.moored { width:calc(var(--w) * 1em / var(--ar)); height:calc(var(--w) * 1em); opacity:0; transition:opacity calc(1.25s / var(--speed)); }
  .boat.moored.in { opacity:1; } .boat.moored.move { transition:none; }
  .boat.moored .bob { height:100%; animation-name:bob2; }
  .boat.moored .hull { position:absolute; left:50%; top:50%; width:calc(var(--w) * 1em); margin:calc(var(--w) * -.5em / var(--ar)) 0 0 calc(var(--w) * -.5em); }
  .boat.ashore { opacity:0; transition:opacity calc(1.25s / var(--speed)); } .boat.ashore.in { opacity:1; }
  .boat.ashore .bob { animation:none; } .boat.ashore .hull { filter:drop-shadow(.1em .16em .14em rgba(90,70,40,.38)); }
  .boat.ashore.off .hull { filter:grayscale(.92) brightness(1.12) drop-shadow(.1em .16em .14em rgba(90,70,40,.3)); opacity:.78; }
  .boat.misty { opacity:0; transition:opacity calc(2.5s / var(--speed)); } .boat.misty.in { opacity:.42; } .boat.misty .hull { filter:blur(.07em) grayscale(.5); }
  .boat.f-bad .hull { filter:drop-shadow(0 0 .45em rgba(220,68,51,.95)) drop-shadow(.14em .26em .2em rgba(4,58,46,.45)); }
  .boat.f-warn .hull { filter:drop-shadow(0 0 .45em rgba(227,160,8,.95)) drop-shadow(.14em .26em .2em rgba(4,58,46,.45)); }
  @keyframes bob { 0%,100% { transform:translateY(0) rotate(-1.2deg); } 50% { transform:translateY(-.13em) rotate(1.2deg); } }
  @keyframes bob2 { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-.09em); } }

  /* 小旗：跑完才升旗，颜色就是结果 */
  .flag { position:absolute; left:46%; bottom:44%; width:1.45em; height:1.9em; overflow:visible; pointer-events:none; transform-origin:18% 96%; transform:scale(0); transition:transform calc(1.25s / var(--speed)) cubic-bezier(.3,1.7,.5,1); }
  .boat.flagged .flag { transform:scale(1); }
  .boat.moored .flag { left:38%; bottom:46%; width:1.1em; height:1.45em; }
  .flag .pole { stroke:#5d4120; stroke-width:1.7; stroke-linecap:round; fill:none; }
  .flag .cloth { fill:var(--fc,var(--ok)); stroke:rgba(0,0,0,.2); stroke-width:.5; transform-origin:3.6px 6px; animation:wave calc(6s / var(--speed)) ease-in-out infinite; animation-delay:var(--bd,0s); }
  .f-ok { --fc:var(--ok); } .f-warn { --fc:var(--warn); } .f-bad { --fc:var(--bad); } .f-gray { --fc:#c3ccc8; }
  @keyframes wave { 0%,100% { transform:skewY(-5deg) scaleX(1); } 50% { transform:skewY(6deg) scaleX(.9); } }

  /* 船下面的小纸条 */
  .tag { position:absolute; left:50%; top:calc(100% + .35em); transform:translateX(-50%); white-space:nowrap; max-width:15em; overflow:hidden; text-overflow:ellipsis;
         padding:.12em .7em .2em; border-radius:.65em; background:rgba(255,255,255,.93); color:var(--text); font-size:clamp(11px,.88em,13.5px); line-height:1.5;
         box-shadow:0 .1em .45em rgba(0,60,45,.3); pointer-events:none; opacity:0; transition:opacity calc(1.25s / var(--speed)); }
  .tag.show { opacity:1; } .tag.lead { max-width:17em; text-align:center; padding-bottom:.28em; } .tag.lead i { display:block; margin:0; font-size:.92em; line-height:1.3; }
  .tag b { color:var(--title); font-variant-numeric:tabular-nums; margin-right:.35em; } .tag i { font-style:normal; color:var(--muted); margin-left:.5em; }
  .boat.f-bad .tag { background:#fff1ee; color:#8f1d15; } .boat.f-bad .tag b { color:#b3261a; }
  .boat.f-warn .tag { background:#fff8e3; color:#7a5200; } .boat.f-warn .tag b { color:#8a5a00; }

  /* 浮标：“现在” */
  .rope { position:absolute; width:0; border-left:max(.14em,2px) dashed rgba(255,255,255,.85); filter:drop-shadow(0 1px 1px rgba(0,60,45,.35)); }
  .buoy { position:absolute; width:max(.92em,9px); height:max(.92em,9px); margin:min(-.46em,-4.5px) 0 0 min(-.46em,-4.5px); border-radius:50%; background:linear-gradient(#fff 0 46%, #e2483d 46% 100%);
          box-shadow:0 .14em .22em rgba(0,50,40,.45), 0 0 0 .1em rgba(255,255,255,.55); transform:scale(0); transition:transform calc(1.1s / var(--speed)) cubic-bezier(.3,1.7,.5,1); }
  .buoy.in { transform:scale(1); animation:bob2 calc(11.25s / var(--speed)) ease-in-out infinite; animation-delay:var(--bd,0s); }
  .buoy.big { width:max(1.3em,12px); height:max(1.3em,12px); margin:min(-.65em,-6px) 0 0 min(-.65em,-6px); }
  .ring { position:absolute; width:5em; height:2.8em; margin:-1.4em 0 0 -2.5em; border-radius:50%; border:.14em solid rgba(255,255,255,.95); pointer-events:none; opacity:0; }

  /* 岸边的灯：一直在岗的守护 */
  .lamp { position:absolute; width:1.9em; height:4.6em; font-size:inherit; padding:0; border:0; background:none; cursor:pointer; transform:translate(-50%,-34%); outline:0; -webkit-tap-highlight-color:transparent; opacity:0; transition:opacity calc(1.25s / var(--speed)); }
  .lamp.lit { opacity:1; }
  .lamp .post { position:absolute; left:50%; top:26%; width:max(.14em,2px); height:1.05em; transform:translateX(-50%); background:#5d4120; border-radius:1px; }
  .lamp .lit { position:absolute; left:50%; top:9%; width:max(.66em,7px); height:max(.82em,8.5px); transform:translateX(-50%); border-radius:40% 40% 46% 46%; background:#b9c2bd; transition:background .5s, box-shadow .5s; }
  .lamp .glow { position:absolute; left:50%; top:46%; width:.95em; height:2.3em; transform:translateX(-50%); border-radius:50%; background:linear-gradient(rgba(255,214,120,.85),rgba(255,190,90,0));
                filter:blur(.16em); mix-blend-mode:screen; opacity:0; transition:opacity .5s; }
  .lamp.lit .lit { background:radial-gradient(circle at 50% 38%,#fff8d0,#ffcb52 55%,#f0902e); box-shadow:0 0 .45em .1em rgba(255,200,90,.95), 0 0 calc(.9em + .9em * var(--night,0)) calc(.25em + .4em * var(--night,0)) rgba(255,176,64,.5);
                   animation:flick calc(17.5s / var(--speed)) ease-in-out infinite; animation-delay:var(--bd,0s); }
  .lamp.lit .glow { opacity:calc(.5 + .5 * var(--night,0)); animation:flick calc(15s / var(--speed)) ease-in-out infinite; animation-delay:var(--bd,0s); }
  .lamp.beat.lit .lit { animation:beat calc(20s / var(--speed)) ease-in-out infinite; animation-delay:var(--bd,0s); }
  .lamp.l-bad.lit .lit { background:radial-gradient(circle at 50% 38%,#ffe1dc,#f0584a 55%,#b3261a); box-shadow:0 0 .5em .15em rgba(220,68,51,.95), 0 0 1.5em .5em rgba(220,68,51,.5); animation:blink calc(4.8s / var(--speed)) steps(2) infinite; }
  .lamp.l-bad .glow { background:linear-gradient(rgba(240,88,74,.85),rgba(240,88,74,0)); }
  .lamp.l-warn.lit .lit { background:radial-gradient(circle at 50% 38%,#fff3c4,#e3a008 60%,#a86f00); box-shadow:0 0 .5em .15em rgba(227,160,8,.95), 0 0 1.4em .45em rgba(227,160,8,.5); }
  .lamp:hover .lit, .lamp:focus-visible .lit, .lamp.on .lit { outline:.14em solid #fff; outline-offset:.14em; }
  @keyframes flick { 0%,100% { opacity:1; } 43% { opacity:.82; } 57% { opacity:.95; } 71% { opacity:.78; } }
  @keyframes beat { 0%,78%,100% { transform:translateX(-50%) scale(1); } 86% { transform:translateX(-50%) scale(1.45); } }
  @keyframes blink { 0% { opacity:1; } 100% { opacity:.35; } }

  /* 木牌 */
  .sign { position:absolute; transform:translate(-50%,-50%) translateY(-.6em); padding:.22em .8em .3em; border:0; border-radius:.5em; background:linear-gradient(#f6e6c4,#ead09c); color:#553a12;
          font-size:clamp(11px,.92em,14px); line-height:1.45; white-space:nowrap; box-shadow:0 .14em 0 #c9a76b, 0 .3em .7em rgba(70,50,20,.28); cursor:pointer; opacity:0;
          transition:opacity calc(1.25s / var(--speed)), transform calc(1.25s / var(--speed)) cubic-bezier(.3,1.5,.5,1); }
  .sign.in { opacity:1; transform:translate(-50%,-50%); }
  .sign b { font-size:1.22em; color:#3f2a08; font-variant-numeric:tabular-nums; margin:0 .12em; }
  .sign::before, .sign::after { content:""; position:absolute; top:100%; width:.22em; height:.6em; background:#a98250; border-radius:0 0 .1em .1em; } .sign::before { left:22%; } .sign::after { right:22%; }
  .sign.now { background:linear-gradient(#fff,#f0f7f2); color:var(--title); box-shadow:0 .14em 0 #b7d9c3, 0 .3em .8em rgba(0,60,45,.3); font-weight:700; cursor:default; }
  .sign.now b { color:var(--title); font-size:1.3em; } .sign.now::before, .sign.now::after { display:none; }

  /* 小鸟：和首页是同一只，站在“现在”的牌子上；夜里睡觉，点它会叫 */
  .bird { position:absolute; left:1.05em; bottom:100%; width:0; height:0; padding:0; border:0; background:none; cursor:pointer; outline:0; -webkit-tap-highlight-color:transparent;
          opacity:0; transform:translateY(-1.7em); transition:opacity calc(1.1s / var(--speed)), transform calc(1.6s / var(--speed)) cubic-bezier(.3,1.5,.5,1); }
  .bird.in { opacity:1; transform:none; }
  .bird img { position:absolute; display:block; max-width:none; filter:drop-shadow(0 .08em .1em rgba(0,50,40,.3)); transform-origin:60% 100%; }
  .bird.asleep img { animation:breathe calc(12s / var(--speed)) ease-in-out infinite; }
  .bird.hop img { animation:hop calc(.9s / var(--speed)) ease-out; }
  .bird::after { content:""; position:absolute; left:-1.3em; top:-2.9em; width:3.4em; height:3.1em; }
  @keyframes breathe { 0%,100% { transform:scale(1,1); } 50% { transform:scale(1.015,1.04); } }
  @keyframes hop { 0%,100% { transform:translateY(0); } 35% { transform:translateY(-.55em) rotate(-4deg); } 70% { transform:translateY(-.1em); } }

  /* 雾 */
  .fog { position:absolute; left:86%; top:24%; width:16%; height:37%; pointer-events:none; opacity:0; transition:opacity calc(3s / var(--speed)); } .fog.in { opacity:1; }
  .fog i { position:absolute; inset:0; background:radial-gradient(ellipse at 62% 50%,rgba(255,255,255,.95),rgba(255,255,255,.55) 38%,rgba(255,255,255,0) 68%); animation:drift calc(50s / var(--speed)) ease-in-out infinite; }
  .fog i + i { inset:18% -8% -6% 10%; animation-duration:calc(65s / var(--speed)); animation-direction:reverse; }
  @keyframes drift { 0%,100% { transform:translate(0,0) scale(1); } 50% { transform:translate(-5%,3%) scale(1.07); } }

  #tip { position:absolute; z-index:20; pointer-events:none; padding:6px 11px 7px; border-radius:9px; background:rgba(255,255,255,.97); color:var(--text); font-size:13px; line-height:1.5;
         box-shadow:0 4px 14px rgba(0,60,45,.25); max-width:280px; opacity:0; transition:opacity .12s; }
  #tip b { color:var(--title); display:block; }
  #stage.still *, #stage.still *::before, #stage.still *::after { animation-play-state:paused !important; }

  /* ---------- 河下面：选中的那一条、航行日志 ---------- */
  .legend { display:flex; flex-wrap:wrap; gap:4px 18px; margin:8px 2px 0; font-size:13px; color:var(--muted); }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .legend i { width:10px; height:10px; border-radius:50%; background:var(--c); }
  .card { margin-top:14px; border:1px solid var(--line); border-radius:14px; background:#fff; padding:14px 18px 16px; }
  .card h2 { margin:0 0 2px; font-size:19px; color:var(--title); display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .card h2 small { font-size:13px; font-weight:400; color:var(--muted); }
  .six { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:10px 26px; font-size:14px; line-height:1.65; margin-top:10px; }
  .six div b { display:block; color:var(--accent); font-size:12.5px; font-weight:700; letter-spacing:.02em; }
  .none { color:#9aa6b2; }
  .state { font-size:13px; font-weight:700; padding:1px 10px; border-radius:999px; border:1px solid; }
  .state.ok { color:#0a7232; border-color:#bfe8cc; background:#edfbf3; } .state.bad { color:#b3261a; border-color:#f1aaa2; background:#fff4f2; }
  .state.warn { color:#8a5a00; border-color:#f0d28a; background:#fffaec; } .state.gray { color:#5d6f8f; border-color:#d9dfe6; background:#f6f8fa; }
  #log h2 { margin-bottom:8px; }
  .group { border-top:1px solid var(--line); } .group:first-of-type { border-top:0; }
  .group > summary { list-style:none; cursor:pointer; padding:11px 2px; display:flex; align-items:center; gap:10px; font-size:15.5px; font-weight:700; color:var(--title); }
  .group > summary::-webkit-details-marker { display:none; }
  .group > summary .dot { width:11px; height:11px; border-radius:50%; background:var(--c); flex:none; }
  .group > summary .n { font-variant-numeric:tabular-nums; font-size:13px; font-weight:700; background:var(--soft); border:1px solid var(--line); border-radius:999px; padding:0 10px; color:var(--title); }
  .group > summary .say { font-size:13px; font-weight:400; color:var(--muted); }
  .group > summary::after { content:"展开"; margin-left:auto; font-size:12.5px; font-weight:400; color:var(--accent); } .group[open] > summary::after { content:"收起"; }
  .rows { display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:0 28px; padding:0 2px 12px; }
  .row { border-top:1px dashed #dcefe3; }
  .row > summary { list-style:none; cursor:pointer; display:flex; align-items:baseline; gap:10px; padding:8px 4px; font-size:14px; border-radius:6px; }
  .row > summary::-webkit-details-marker { display:none; }
  .row > summary:hover { background:var(--soft); }
  .row .dot { flex:none; width:9px; height:9px; border-radius:50%; background:var(--c); transform:translateY(-1px); }
  .row .t { flex:none; min-width:46px; color:var(--muted); font-variant-numeric:tabular-nums; font-size:13px; }
  .row .nm { flex:1; }
  .row[open] { grid-column:1 / -1; background:#f8fdfa; border:1px solid var(--line); border-radius:10px; margin:6px 0; padding:2px 10px 12px; }
  .row[open] > summary .nm { font-weight:700; color:var(--title); }
  .foot { margin-top:14px; color:var(--muted); font-size:13px; line-height:1.75; }
  @media (max-width:900px) { .hint { display:block; } h1 { font-size:25px; } #headline { font-size:15px; } }
  @media (prefers-reduced-motion: reduce) { #stage *, #stage *::before, #stage *::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <p class="crumb">驾驶舱 / 自动任务</p>
  <h1>今天的河</h1>
  <p id="headline"></p>
  <p class="when" id="when"></p>
  <p class="fake" id="fake" hidden></p>
  <div id="alerts"></div>
  <div id="scroller">
    <div id="stage" aria-label="今天的河：电脑上自动任务今天的情况">
      <div id="paper"></div><canvas id="water"></canvas><div id="layer"></div><div id="tip"></div>
    </div>
  </div>
  <p class="hint">左右滑动，可以看整条河。</p>
  <div class="legend" id="legend"></div>
  <div class="card" id="pick" hidden></div>
  <div class="card" id="log"></div>
  <p class="foot" id="foot"></p>
</div>
<script>window.SNAP = /*__DATA__*/null; window.GEOM = /*__GEOM__*/null; window.MASK = "__MASK__"; window.BIRD = /*__BIRD__*/null;</script>
<script>
(() => {
'use strict';
const SPEED = 2.5;                 // 整体速度：水、船、灯、开场都按这个倍数走，只改这一个数
const GATE = 47;                   // “现在”那排浮标在河的哪里（横向百分比）
const KEEP = 5;                    // 浮标两边，河面上各留几条写着名字的船
const DOCK = 16;                   // 每个码头最多画几条船，再多只写在木牌和日志里
const I = { reveal: 3.6, gate: .8, clock: [2, 12], future: 3.2, fleet: 4.2, lamps: 4.8, signs: 1.5, end: 16.5 };   // 开场各段从什么时候开始（按动效自己的时间算，真实时间是它除以 SPEED；整段开场真实约 6 秒）

const GEOM = window.GEOM, $ = s => document.querySelector(s), root = document.documentElement;
const stage = $('#stage'), layer = $('#layer'), tip = $('#tip'), canvas = $('#water');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
root.style.setProperty('--speed', SPEED); stage.style.setProperty('--aspect', GEOM.aspect);

// ---------- 小工具 ----------
const mk = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const parse = s => s ? Date.parse(String(s).replace(/(\.\d{3})\d+/, '$1')) : NaN;
const bj = ms => new Date(ms + 8 * 3600e3), pad = n => String(n).padStart(2, '0');           // 一律按北京时间读，不跟浏览器的时区走
const hm = ms => { const d = bj(ms); return pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()); };

}

}

    (nBad || nWarn ? [nBad ? `<span class="bad">有 ${nBad} 条出错</span>` : '', nWarn ? `<span class="warn">${nBad ? '' : '有 '}${nWarn} 条要留意</span>` : ''].filter(Boolean).join('、') + '。' : '没有出错的，也没有要留意的。') +
    `今天已经跑完 <b>${ranToday}</b> 趟，还有 <b>${M.future.length}</b> 趟要跑；<b>${M.guards.length}</b> 个守护一直在岗。另有 ${nShore} 条今天不出航或已停用${M.fog.length ? `，${M.fog.length} 条这次没读到结果` : ''}。`;
  $('#when').textContent = `读到电脑的时间：${obs}（北京时间）· 一共 ${M.tasks.length} 个自动任务`;
  const fake = $('#fake'); fake.hidden = M.snap.sample_kind !== 'hypothetical'; fake.textContent = M.snap.source_note || '';
  const al = $('#alerts'); al.textContent = '';
  M.alerts.forEach(t => { const e = mk('button', 'alert ' + t.flag, al, `<b>${esc(t.name)}</b>${STATE[t.flag]}${t.note ? '：' + esc(t.note) : ''}${t.last > 0 ? `（${esc(whenText(M, t.last))}）` : ''}`); e.type = 'button'; e.onclick = () => pick(t, true); });
  $('#legend').innerHTML = [['var(--ok)', '绿旗：跑完，正常'], ['var(--warn)', '黄旗：要留意'], ['var(--bad)', '红旗：出错'], ['#c3ccc8', '灰旗：跑了，但没读到结果'], ['#ffcb52', '亮着的灯：一直在岗的守护']]
    .map(([c, s]) => `<span><i style="--c:${c}"></i>${s}</span>`).join('') + '<span>没升旗的船：还没到点</span>';
  const log = $('#log'); log.innerHTML = '<h2>航行日志<small>点一行，看它在做什么、上次和下次、有没有出错、怎么停、停了影响什么</small></h2>';
  const C = { ok: 'var(--ok)', warn: 'var(--warn)', bad: 'var(--bad)', gray: 'var(--gray)' };
  const group = (key, title, say, list, open, timeOf, colorOf, head) => { if (!list.length) return;
    const d = mk('details', 'group', log); d.id = 'g-' + key; d.open = open;
    d.innerHTML = `<summary><span class="dot" style="--c:${head}"></span>${title}<span class="n">${list.length}</span><span class="say">${say}</span></summary><div class="rows"></div>`;
    list.forEach(x => { const t = x.t || x, r = mk('details', 'row', d.lastChild);
      r.innerHTML = `<summary><span class="dot" style="--c:${colorOf(x)}"></span><span class="t">${esc(timeOf(x) || '—')}</span><span class="nm">${esc(t.name)}</span></summary>`;
      r.addEventListener('toggle', () => { if (r.open && !r.querySelector('.six')) r.insertAdjacentHTML('beforeend', six(M, t).replace(/<h2>.*?<\/h2>/, '')); mark(r.open ? t : null); }); });
  };
  const day = ms => !(ms > 0) ? '' : dkey(ms) === M.today ? hm(ms) : dkey(ms) === M.today - 1 ? '昨天' : `${bj(ms).getUTCMonth() + 1}/${bj(ms).getUTCDate()}`;
  group('alert', '出错的、要留意的', '先看这里', M.alerts, true, t => day(t.last), t => C[t.flag], C.bad);
  group('past', '今天跑完的', '浮标左边升了旗的船', M.past.filter(p => p.t.ran).sort((a, b) => b.at - a.at), true, p => hm(p.at), p => C[p.t.flag], C.ok);
  group('future', '今天还要跑的', '浮标右边还没升旗的船，按出发时间排', M.future, true, p => hm(p.at), () => '#9fd8b3', '#9fd8b3');
  group('guard', '一直在岗的守护', '岸边亮着的灯', M.guards, false, t => t.every <= 30 ? (t.every < 1 ? '每几秒' : t.every === 1 ? '每分钟' : `每 ${t.every} 分`) : '常开', t => t.alert ? C[t.flag] : '#ffcb52', '#ffcb52');
  group('idle', '今天不出航的', '平时正常，只是今天没有安排', M.idle, false, t => day(t.last), () => '#7cc79b', '#7cc79b');
  group('off', '停用的、从没跑过的', '拉到岸上的船', M.off, false, t => t.off ? '停用' : '没跑过', () => C.gray, C.gray);
  group('fog', '雾里的', '这次没读到运行结果，不代表出错', M.fog, false, () => '', () => '#c9d3de', '#c9d3de');
  $('#foot').textContent = M.snap.sample_kind === 'hypothetical' ? '这是驾驶舱“今天的河”本地小样第二版里的假设验收页，没有碰网站。只看，不能操作。'
    : '这是驾驶舱“今天的河”的本地小样第二版，没有碰网站。数据是从电脑上只读取来的一份真实记录，停在读到的那一刻；上线后浮标跟着真实时间走，船到点自己过浮标。只看，不能操作。';
}
function mark(t) { document.querySelectorAll('#layer .on').forEach(e => e.classList.remove('on')); if (t) (els.get(t.i) || []).forEach(e => e.classList.add('on')); }
function pick(t, scroll) { mark(t); const p = $('#pick'); p.hidden = false; p.innerHTML = six(M, t); if (scroll) p.scrollIntoView({ block: 'nearest', behavior: reduce ? 'auto' : 'smooth' }); }
function openGroup(key) { const d = $('#g-' + key) || $('#g-off'); if (!d) return; d.open = true; d.scrollIntoView({ block: 'start', behavior: reduce ? 'auto' : 'smooth' }); }
layer.addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) pick(M.tasks[+b.dataset.i]); });
const showTip = e => { const b = e.target.closest?.('[data-i]'); if (!b) { tip.style.opacity = 0; return; } const t = M.tasks[+b.dataset.i], r = stage.getBoundingClientRect(), q = b.getBoundingClientRect();
  tip.innerHTML = `<b>${esc(t.name)}</b>${esc(b.dataset.tip || stateOf(t)[1])}`; tip.style.left = clamp(q.left - r.left + q.width / 2 - 70, 6, r.width - 290) + 'px';
  tip.style.top = (q.top - r.top > 90 ? q.top - r.top - 62 : q.bottom - r.top + 10) + 'px'; tip.style.opacity = 1; };
layer.addEventListener('pointerover', showTip); layer.addEventListener('focusin', showTip); layer.addEventListener('pointerleave', () => { tip.style.opacity = 0; }); layer.addEventListener('focusout', () => { tip.style.opacity = 0; });

// ---------- 天色：跟着杭州的日出日落 ----------
function nightOf(ms) {
  const d = bj(ms), rad = Math.PI / 180, N = Math.floor((Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - Date.UTC(d.getUTCFullYear(), 0, 0)) / 864e5), g = 2 * Math.PI / 365 * (N - 1);
  const eqt = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
  const dec = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
  const lat = 30.2741 * rad, lon = 120.1551, ha = Math.acos(Math.cos(90.833 * rad) / (Math.cos(lat) * Math.cos(dec)) - Math.tan(lat) * Math.tan(dec)) / rad;
  const sr = (720 - 4 * (lon + ha) - eqt) / 60 + 8, ss = (720 - 4 * (lon - ha) - eqt) / 60 + 8, h = d.getUTCHours() + d.getUTCMinutes() / 60;
  const ramp = (a, b, x) => sstep(clamp((x - a) / (b - a)));
  const n = h < 12 ? 1 - ramp(sr - 1.1, sr + .5, h) : ramp(ss - .3, ss + 1.2, h);                 // 夜有多深，0 到 1
  const w = Math.max(0, 1 - Math.abs(h - (sr + .1)) / 1.1, 1 - Math.abs(h - (ss - .2)) / 1.2);    // 日出日落前后的暖光
  return { n, w };
}

// ---------- 水：让画里的河真的流起来 ----------
const VS = 'attribute vec2 a; varying vec2 vUv; void main(){ vUv = vec2(a.x*.5+.5, .5-a.y*.5); gl_Position = vec4(a,0.,1.); }';
const FS = `precision highp float;
varying vec2 vUv; uniform sampler2D uTex, uMask; uniform float uT, uA, uReveal, uGray, uNight, uWarm; uniform vec4 uBoat[14];
float hash(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f); return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x), mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x), f.y); }
float fbm(vec2 p){ float s=0., a=.5; for(int i=0;i<3;i++){ s+=a*noise(p); p=p*2.03+vec2(17.3,9.1); a*=.5; } return s; }
void main(){
  vec2 uv = vUv, p = vec2(uv.x*uA, uv.y); float m = texture2D(uMask, uv).r;
  // 船尾拖出来的水痕、船头压出来的一道弧
  vec2 push = vec2(0.); float foam = 0.;
  for (int i=0;i<14;i++){
    vec4 b = uBoat[i]; if (b.w <= 0.) continue;
    float L = b.z; vec2 d = p - vec2(b.x*uA, b.y);
    if (abs(d.y) > L*1.25 || d.x < -L*.9 || d.x > L*4.) continue;
    float s = d.x - L*.4, c = d.y, fade = smoothstep(0., L*.3, s) * exp(-s/(L*1.7));
    float arm = L*.12 + s*.26, w = L*(.05 + s/L*.05), n = noise(vec2(s/L*9. - uT*.75, c/L*14. + float(i)*7.));
    float la = (abs(c)-arm)/w; float line = exp(-la*la) * (.35 + 1.1*n);
    float inner = smoothstep(arm, arm*.1, abs(c)) * max(fbm(vec2(s/L*7. - uT*.6, c/L*12.)) - .3, 0.) * 2.2;
    float rip = sin(s/L*22. - uT*2.5) * smoothstep(arm*1.1, 0., abs(c)) * fade;
    foam += (line*1.25 + inner*.8) * fade * b.w;
    push += vec2(rip*.003, sign(c)*line*fade*.003) * b.w;
    vec2 e = vec2(d.x + L*.36, c*1.25);
    float ba = (length(e) - L*.17)/(L*.035); foam += exp(-ba*ba) * smoothstep(L*.02, -L*.1, d.x + L*.36) * (.5 + .5*n) * .95 * b.w;
  }
  // 水往右流：同一处的画分两拍错开着挪，接起来就是一直在流（1460 宽时每秒约 9—10 像素；和时间有关的常数都按这个快慢定，改快慢要一起改）
  float my = .2*sin(uv.x*5.2 + uv.y*3.);
  vec2 f = vec2(1., my*uA) * .036 * m;
  vec2 sh = (vec2(fbm(p*8. + vec2(uT*.1, 0.)), fbm(p*8. + vec2(31.7, uT*.085))) - .5) * .0042;
  vec2 base = uv + (sh + push) * m;
  float ph = uT*.0725 + noise(p*2.6)*.7, p0 = fract(ph), p1 = fract(ph + .5);
  vec3 col = mix(texture2D(uTex, base - f*(p0-.5)).rgb, texture2D(uTex, base - f*(p1-.5)).rgb, abs(p0-.5)*2.);
  // 水面上漂着的光网和碎光
  vec2 q = p*vec2(9., 13.) - vec2(uT*.25, 0.) + (fbm(p*4. + uT*.05) - .5)*1.5;
  float ca = pow(1. - abs(2.*noise(q) - 1.), 7.) + .6*pow(1. - abs(2.*noise(q*1.9 + 4.7) - 1.), 9.);
  col += vec3(1., 1., .9) * ca * .12 * m * (1. - .55*uNight);
  vec2 gp = vec2(p.x - uT*.0045, p.y) * 46.; vec2 gc = floor(gp); float gh = hash(gc);
  vec2 gq = gc + .25 + .5*vec2(hash(gc + 3.1), hash(gc + 7.7));
  float glint = smoothstep(.17, 0., length(gp - gq)) * pow(max(0., sin(uT*(.35 + gh*.6) + gh*40.)), 10.) * step(.8, gh);
  col += glint * .8 * m * (1. - .3*uNight);
  col = mix(col, vec3(.96, 1., .97), clamp(foam, 0., 1.) * .78 * m);
  // 天色：夜里偏蓝偏暗，日出日落偏暖；纸的留白不跟着变
  float ink = smoothstep(.985, .8, min(col.r, min(col.g, col.b)));
  col = mix(col, col*vec3(.5,.69,.86)*.92 + vec3(0.,.012,.035), uNight*.62*ink*(1. - uGray));
  col = mix(col, col*vec3(1.08,.95,.78), uWarm*.55*ink);
  float gr = dot(col, vec3(.3,.59,.11)); col = mix(col, vec3(gr)*1.03 + .02, uGray*.88);
  // 四边化进白纸里；开场从浮标那里晕开
  float nz = fbm(p*4.5); vec2 ed = min(uv, 1.-uv);
  float show = smoothstep(0., .05, ed.x + (nz-.5)*.03) * smoothstep(0., .075, ed.y + (nz-.5)*.045);
  float dist = distance(p, vec2(${(GATE / 100).toFixed(3)}*uA, .44)) / (uA*.62);
  show *= 1. - smoothstep(uReveal*1.5 - .24, uReveal*1.5, dist + (nz-.5)*.28);
  gl_FragColor = vec4(mix(vec3(1.), col, show), 1.);
}`;
const GL = { gl: null, u: {}, ok: false };
async function initGL() {
  const load = src => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('图没读出来')); im.src = src; });
  try {
    const gl = canvas.getContext('webgl', { alpha: false, antialias: false, powerPreference: 'high-performance' }); if (!gl) throw new Error('这台设备开不了 WebGL');
    const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
    const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr)); gl.useProgram(pr);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    const a = gl.getAttribLocation(pr, 'a'); gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
    const url = getComputedStyle(stage).getPropertyValue('--river').trim().replace(/^url\(["']?|["']?\)$/g, '');
    const [river, mask] = await Promise.all([load(url), load(window.MASK)]);
    [river, mask].forEach((im, k) => { gl.activeTexture(gl.TEXTURE0 + k); gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, im);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); });
    ['uTex', 'uMask', 'uT', 'uA', 'uReveal', 'uGray', 'uNight', 'uWarm', 'uBoat'].forEach(n => GL.u[n] = gl.getUniformLocation(pr, n));
    gl.uniform1i(GL.u.uTex, 0); gl.uniform1i(GL.u.uMask, 1); GL.gl = gl; GL.ok = true;
    canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); GL.ok = false; stage.classList.add('nogl'); });
  } catch (err) { console.info('[今天的河] 水面动效没开起来，改用静止的画：', err.message || err); stage.classList.add('nogl'); }
}
const boatBuf = new Float32Array(56);
function draw(tb) {
  if (!GL.ok) return; const gl = GL.gl, u = GL.u;
  const w = Math.round(stage.clientWidth * Math.min(1.5, devicePixelRatio || 1)), h = Math.round(w / GEOM.aspect);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; gl.viewport(0, 0, w, h); }
  boatBuf.fill(0); wakes.filter(o => o.s > .02).sort((a, b) => b.s - a.s).slice(0, 14).forEach((o, k) => boatBuf.set([o.x / 100, o.y / 100, o.w / 100 * GEOM.aspect, o.s], k * 4));
  gl.uniform4fv(u.uBoat, boatBuf); gl.uniform1f(u.uT, Math.min(tb, 1e6) % 4000); gl.uniform1f(u.uA, GEOM.aspect); gl.uniform1f(u.uReveal, clamp(tb / I.reveal));
  gl.uniform1f(u.uGray, M.stale ? 1 : 0); if (M.stale) boatBuf.fill(0), gl.uniform4fv(u.uBoat, boatBuf); gl.uniform1f(u.uNight, M.night.n); gl.uniform1f(u.uWarm, M.night.w);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

// ---------- 时间和循环 ----------
const clock = { t0: null, skip: false, manual: null, done: false };
const fit = () => { stage.style.fontSize = stage.clientWidth / 100 + 'px'; };
let raf = 0, seen = true, still = false, last = 0, gaps = [], since = 0;
function step(tb) { if (!clock.done || clock.manual != null) acts.forEach(f => f(tb)); if (tb >= I.end && clock.manual == null) clock.done = true; draw(tb); }
function frame(ts) {
  raf = 0; if (still || document.hidden || !seen) return;
  if (clock.t0 == null) clock.t0 = ts - (clock.skip ? I.end / SPEED * 1000 : 0);          // 第一次真的画出来才开始算时间，后台打开的页面不会把开场白白放掉
  step(clock.manual != null ? clock.manual : (ts - clock.t0) / 1000 * SPEED);
  // 防卡死的保险：页面看得见、动画在播、连着大约 5 秒帧率的中位数低于 10 帧，才退回静止；只管这一次这一页
  if (last) { const gap = ts - last; since += gap; if (since > 2000) { gaps.push(gap); let sum = 0; for (const g of gaps) sum += g; while (sum > 5000 && gaps.length > 1) sum -= gaps.shift();
    if (sum >= 4800 && gaps.length >= 5) { const s = [...gaps].sort((a, b) => a - b), fps = 1000 / s[s.length >> 1]; if (fps < 10) { freeze(`连着 5 秒帧率中位数只有 ${fps.toFixed(1)} 帧，低于 10 帧`); return; } } } }
  last = ts; raf = requestAnimationFrame(frame);
}
function freeze(why) { still = true; stage.classList.add('still'); acts.forEach(f => f(1e9)); draw(1e9); console.info('[今天的河] 这一次改成静止画面：' + why); }
const wake = () => { last = 0; since = 0; gaps = []; if (!raf && !still && !reduce && !(M && M.stale)) raf = requestAnimationFrame(frame); };
document.addEventListener('visibilitychange', wake);
new IntersectionObserver(es => { seen = es[0].isIntersecting; if (seen) wake(); }).observe(stage);
addEventListener('resize', () => { fit(); if (reduce || still || (M && M.stale)) draw(1e9); });

async function start(snap, intro = true) {
  fit(); build(snap);
  if (!GL.gl && !stage.classList.contains('nogl')) await initGL();
  const sc = $('#scroller'); sc.scrollLeft = Math.max(0, stage.clientWidth * GATE / 100 - sc.clientWidth / 2 + 18);
  stage.classList.toggle('still', still || M.stale);
  if (reduce || still || M.stale) { acts.forEach(f => f(1e9)); draw(1e9); return; }      // 读不到电脑时河停住，不放开场
  clock.done = false; clock.manual = null; clock.t0 = null; clock.skip = !intro; wake();
}
// 接入用：setSnapshot 换一份新读到的数据；验收用：seek(秒) 定格到开场的某一刻，resume() 接着走
window.todayRiver = { SPEED, setSnapshot: (s, intro = false) => start(s, intro), replay: () => start(M.snap, true),
  seek: s => { clock.manual = s * SPEED; clock.done = false; step(clock.manual); }, resume: () => { clock.t0 = performance.now() - (clock.manual || 0) / SPEED * 1000; clock.manual = null; wake(); },
  get model() { return M; }, get still() { return still; }, get gl() { return GL.ok; } };
start(window.SNAP, true).then(() => { window.todayRiver.ready = true; });
})();
