<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>页面不存在｜吴乐阳</title>
    <style>
      :root {
        color: #101210;
        background: #fff;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      }
      * { box-sizing: border-box; }
      body { min-width: 320px; min-height: 100svh; margin: 0; }
      header { min-height: 72px; border-bottom: 1px solid #e1e4e1; }
      header a { display: flex; width: min(100%, 1360px); min-height: 72px; align-items: center; margin: 0 auto; padding: 0 44px; color: #101210; font-weight: 700; text-decoration: none; }
      main { display: flex; width: min(100%, 1360px); min-height: calc(100svh - 72px); flex-direction: column; justify-content: center; margin: 0 auto; padding: 70px 44px 90px; }
      .eyebrow { margin: 0; color: #107c38; font: 600 12px/1.5 Consolas, monospace; letter-spacing: .045em; text-transform: uppercase; }
      h1 { margin: 18px 0 16px; font-size: clamp(50px, 8vw, 96px); line-height: 1; letter-spacing: -.065em; }
      p { max-width: 620px; margin: 0; color: #626762; font-size: 16px; line-height: 1.75; }
      nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
      nav a { display: inline-flex; min-height: 46px; align-items: center; padding: 0 17px; border: 1px solid #cfd3cf; border-radius: 4px; color: #101210; font-size: 14px; font-weight: 600; text-decoration: none; }
      nav a:first-child { background: #101210; color: #fff; }
      nav a:hover { border-color: #16a34a; color: #107c38; }
      nav a:first-child:hover { background: #107c38; color: #fff; }
      a:focus-visible { outline: 2px solid #16a34a; outline-offset: 4px; }
      @media (max-width: 680px) {
        header a, main { padding-right: 18px; padding-left: 18px; }
        header, header a { min-height: 64px; }
        main { min-height: calc(100svh - 64px); }
      }
    </style>
  </head>
  <body>
    <header><a href="/">吴乐阳</a></header>
    <main>
      <p class="eyebrow">Error / 404</p>
      <h1>这里没有这页。</h1>
      <p>地址可能已经变化，也可能从未存在。可以返回项目清单，或进入规则与 Skills 工作台。</p>
      <nav aria-label="404 页面导航">
        <a href="/">返回首页</a>
        <a href="/rules/">查看规则</a>
        <a href="/skills/">查看 Skills</a>
      </nav>
    </main>
  </body>
</html>
