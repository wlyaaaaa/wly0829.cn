<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#f1efe8" />
    <title>页面不存在｜吴乐阳</title>
    <style>
      :root { color: #171816; background: #f1efe8; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 760px); border-top: 1px solid #171816; border-bottom: 1px solid rgba(23, 24, 22, 0.3); padding: 56px 0; }
      p { margin: 0; color: #5b5d57; font: 11px/1.5 Consolas, monospace; letter-spacing: 0.12em; text-transform: uppercase; }
      h1 { margin: 24px 0 18px; font-size: clamp(44px, 10vw, 88px); line-height: 0.95; letter-spacing: -0.06em; }
      a { display: inline-flex; margin-top: 28px; padding: 13px 18px; background: #171816; color: #f1efe8; font: 11px Consolas, monospace; letter-spacing: 0.08em; text-decoration: none; }
      a:hover { background: #3157f6; }
      a:focus-visible { outline: 2px solid #171816; outline-offset: 4px; box-shadow: 0 0 0 7px #ff5e36; }
    </style>
  </head>
  <body>
    <main>
      <p>Error / 404</p>
      <h1>这里没有这页。</h1>
      <p>链接可能已经变化，也可能从未存在。</p>
      <a href="/">返回首页 →</a>
    </main>
  </body>
</html>
