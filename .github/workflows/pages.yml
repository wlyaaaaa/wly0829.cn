name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      site:
        description: "auto deploys the prepared site; legacy rebuilds Vite; rollback restores exact static bytes"
        type: choice
        options: [auto, legacy, rollback]
        default: auto
      restore_ref:
        description: "Exact commit containing the previous site-release (required for rollback)"
        type: string
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      pages_artifact_id: ${{ steps.pages_artifact.outputs.artifact_id }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore exact static release
        if: inputs.site == 'rollback'
        env:
          RESTORE_REF: ${{ inputs.restore_ref }}
        run: |
          test -n "$RESTORE_REF" || { echo 'restore_ref is required'; exit 1; }
          python3 scripts/hybrid-release.py restore --ref "$RESTORE_REF" --output restored-release
          if [ -d site-release ]; then mv site-release before-restore-release; fi
          mv restored-release site-release

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Select publication source
        id: source
        env:
          REQUESTED_SITE: ${{ inputs.site || 'auto' }}
        run: |
          if [ "$REQUESTED_SITE" = legacy ] || [ ! -f site-release/index.html ]; then
            echo "site=legacy" >> "$GITHUB_OUTPUT"
          elif [ -f site-release/release-manifest.json ]; then
            echo "site=hybrid" >> "$GITHUB_OUTPUT"
          else
            echo "site=assembled" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.source.outputs.site == 'legacy'
        run: npm ci

      - name: Build and verify public content
        if: steps.source.outputs.site == 'legacy'
        run: npm run build

      - name: Test source and generated routes
        if: steps.source.outputs.site == 'legacy'
        run: npm run test:built

      - name: Validate prepared static release
        if: steps.source.outputs.site == 'assembled'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest discover -s tests -p 'test_assembled_publication.py'
          python3 -c "import shutil; shutil.copytree('site-release', 'dist')"
          python3 scripts/build-assembled-site.py --verify-only --public-repos-from-github

      - name: Validate byte-preserving hybrid release
        if: steps.source.outputs.site == 'hybrid'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest discover -s tests -p 'test_hybrid_release.py'
          python3 -m unittest discover -s tests -p 'test_oss_release.py'
          python3 -c "import shutil; shutil.copytree('site-release', 'dist')"
          python3 scripts/hybrid-release.py verify --output dist --content-report hybrid-content-report.json --public-repos-from-github

      - name: Reverify final generated artifact
        run: npm run verify:public

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        id: pages_artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          retention-days: 1

      - name: Write size and reference summary
        if: always() && steps.source.outputs.site == 'assembled'
        run: |
          if [ -f .publish/size-report.json ]; then
            printf '\n```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat .publish/size-report.json >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Write exact static release identity
        if: steps.source.outputs.site == 'hybrid'
        env:
          RESTORE_REF: ${{ inputs.restore_ref }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          with open('dist/release-manifest.json', encoding='utf8') as stream:
              manifest = json.load(stream)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf8') as stream:
              stream.write('\nStatic release: `' + manifest['release_id'] + '`\n')
              stream.write('\nWorkflow source commit: `' + os.environ['SOURCE_COMMIT'] + '`\n')
              if os.environ.get('RESTORE_REF'):
                  stream.write('\nExact bytes restored from: `' + os.environ['RESTORE_REF'] + '`. This dispatch does not change main.\n')
          PY

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Remove this run's temporary Pages artifact after successful deployment
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ needs.build.outputs.pages_artifact_id }}
        run: gh api --method DELETE "repos/${{ github.repository }}/actions/artifacts/$PAGES_ARTIFACT_ID"
