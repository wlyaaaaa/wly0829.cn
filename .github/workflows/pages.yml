name: Deploy GitHub Pages

on:
  push:
    branches:
      - site-dist
  workflow_dispatch:
    inputs:
      ref:
        description: 'site-dist commit to deploy; use an earlier SHA to restore that exact artifact'
        type: string
        required: false
        default: site-dist

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out prepared artifact
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload prepared artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
          include-hidden-files: true
          retention-days: 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
