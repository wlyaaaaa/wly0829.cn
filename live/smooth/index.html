<style>
.page--smooth .grp__main { grid-template-columns: minmax(0, 1fr); gap: 18px; }
.page--smooth .grp__main > .grp__lead { grid-row: 2; }
.page--smooth .grp__main > .grp__chips { grid-row: 1; }
.page--smooth .grp__chips .vz-chips { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.page--smooth .vz-tl__row { grid-template-columns: 30px minmax(0, 1fr); }
.page--smooth .vz-tl__label { grid-column: 1 / -1; grid-row: 1; display: block; margin-bottom: 6px; white-space: nowrap; }

.page--smooth .vz-tl__axis { grid-row: 3; }

.page--smooth .hero__warns a { display: inline; }
.page--smooth .hero__warns { font-size: 15px; line-height: 23px; }
.page--smooth .hero__warns { display:flex; flex-wrap:wrap; gap:4px 20px; }
.page--smooth [data-key="fps"] .grp__main { grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); }
.page--smooth [data-key="fps"] .grp__main > :is(.grp__lead,.grp__chips) { grid-row:1; min-width:0; }
.page--smooth [data-key="fps"] .grp__main:has(.grp__chips:empty) { grid-template-columns: minmax(0, 1fr); }

.page--smooth :is([data-key="stutters"], [data-key="apps"]) .grp__chapter { container-type: inline-size; }
.page--smooth [data-key="apps"] .grp-split { grid-template-columns: minmax(0, 1fr); align-items: start; }
.stutter-layout { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-areas: "timeline" "daily" "moments" "gap"; gap: 24px 32px; align-items: start; }
.stutter-layout > [data-x="moments"] { grid-area: moments; }
.stutter-layout .vz-moment--empty { color: var(--ink-soft); font-size: 15px; }
.page--smooth .grp[data-no-stutter] .grp__lamp .lamp:is([data-tone="gray"], [data-tone="grey"], [data-tone="off"]) { visibility: hidden; }
.stutter-layout > [data-x="timeline"] { grid-area: timeline; }
.stutter-layout > [data-x="daily"] { grid-area: daily; }
.stutter-layout > .stat-gap { grid-area: gap; color: #5f5d57; font-size: 12px; line-height: 20px; }
.stutter-layout > .stat-gap:empty { display: none; }
.stutter-layout .vz-legend { margin-inline: 30px 8px; }
.stutter-layout .vz-legend__name b { text-wrap: balance; }
.page--smooth [data-key="fps"] .vz-legend {
  grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
  margin-inline: 30px 0;
}
.page--smooth :is(.stutter-layout,[data-key="fps"]) .vz-legend__name b,
.page--smooth [data-key="apps"] :is(.vz-rank__label, .vz-rank__name small, .grp__said) {
  white-space: normal;
  word-break: normal;
  overflow-wrap: anywhere;
  overflow: visible;
  text-overflow: clip;
}
.page--smooth [data-key="apps"] .vz-rank__name small { word-break: keep-all; overflow-wrap: break-word; }
.page--smooth .grp__chapter .stat-gap { margin-inline-start: 0; }
.page--smooth .grp[data-key="stutters"] .grp__line { flex-wrap: wrap; row-gap: 0; }
.page--smooth .grp[data-key="stutters"] .grp__status { white-space: normal; overflow: visible; }
.stutter-layout .chart__head { display: grid; gap: 8px; }
.stutter-layout .chart__vals { justify-content: flex-start; justify-self: start; margin-left: 0; font-size: 13px; }
.stutter-layout .vz-bars { --chart-h: 130px; }
.page--smooth .l2-nav > span { color: var(--muted); font-size: 13px; }
@container (min-width: 660px) {
  .page--smooth [data-key="apps"] .grp-split { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); }

    grid-template-columns: minmax(230px, .7fr) minmax(0, 1.3fr);
    grid-template-rows: auto auto 1fr auto;
    grid-template-areas: "moments timeline" "moments daily" "moments ." "gap gap";
  }
}
@container (width < 1080px) {
  .page--smooth [data-key="apps"] .grp-split.is-unbalanced > :last-child { order: -1; }
}
@container (min-width: 1080px) {
  .page--smooth [data-key="apps"] .grp-split.is-unbalanced { grid-template-columns: minmax(0,2fr) minmax(0,1fr); }
  .page--smooth .is-unbalanced [data-x="apps"] .vz-rank__list { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 0 18px; }
}
