<style>
.page--phone .grp { --live-figure-count:4; }
.page--phone [data-key="apps"] .grp__figs { grid-template-columns:1.05fr 1fr .9fr 1.55fr; }
.page--phone [data-key="collect"] .grp__fk { white-space:normal; overflow:visible; letter-spacing:0; line-height:18px; }
.page--phone [data-key="collect"] .grp__fig { grid-template-rows:36px 30px; }

.page--phone .grp[data-key="usage"] { --pic-y:32%; }
.page--phone .grp[data-key="usage"]:is(.is-gone,:not(:has(.grp__extra:not([hidden])))) .card__pic { display:none; }

.page--phone .grp__status[data-leading-note] > [data-block]:first-child::before { content:'· '; }

.page--phone .grp.is-open:is([data-key="usage"],[data-key="network"])[data-pic] {
  --win:min(29%,360px);
  --phone-art-fade:linear-gradient(#000 84%,transparent);
}
.page--phone .grp.is-open:is([data-key="usage"],[data-key="network"]) .card__pic {
  bottom:auto;
  aspect-ratio:2 / 3;
  max-height:100%;
}
.page--phone .grp.is-open:is([data-key="usage"],[data-key="network"]) .card__pic img {
  object-fit:contain;
  object-position:right top;
  -webkit-mask-image:var(--phone-art-fade);
  mask-image:var(--phone-art-fade);
}
.phone-unread .head__lead { color:var(--muted); }
.page--phone .phone-range { display:flex; align-items:center; justify-content:space-between; gap:20px; margin:0 0 18px; font-size:14px; }
.page--phone .phone-gap { position:absolute; top:50%; transform:translateY(-50%); text-align:center; color:var(--ink-soft); font-size:12px; white-space:nowrap; pointer-events:none; }
.page--phone .phone-chart .chart--hero .chart__plot { height:220px; }
.page--phone :is([data-key="usage"],[data-key="network"]) .vz-rank__list:has(> :nth-child(7)) { columns:232px 2; column-gap:20px; }
.page--phone :is([data-key="usage"],[data-key="network"]) .vz-rank__row {
  break-inside:avoid;
  margin:0 0 3px;
  padding:4px 4px 7px;
  column-gap:8px;
  line-height:20px;
}
.page--phone :is([data-key="usage"],[data-key="network"]) :is(.vz-rank__name,.vz-rank__label) { display:block; white-space:normal; overflow:visible; overflow-wrap:anywhere; }
.page--phone :is([data-key="usage"],[data-key="network"]) .vz-rank__name small { margin-inline-start:8px; white-space:nowrap; }
.page--phone .phone-details + .use-note, .page--phone .use-note + h3 { margin-top:24px; }
.page--phone :is(.grp__fv,.mach__tag,.vz-rank__v,.phone-details dd) { white-space:nowrap; overflow-wrap:normal; }

.page--phone [data-key="collect"] [data-row="link"] .vz-tl__plot {
  margin-inline:var(--phone-link-start,0px) var(--phone-link-end-gap,0px);
  container-type:inline-size;
}
.page--phone .phone-start { position:absolute; inset:auto auto 100% 0; translate:min(0px,calc(100cqi - 100%)); width:max-content; padding-bottom:4px; font-size:12px; color:var(--ink-soft); white-space:nowrap; pointer-events:none; }
.page--phone [data-key="collect"] .vz-legend { grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px 20px; }
.page--phone [data-key="collect"] .vz-tl__row:first-child { padding-top:20px; }
.page--phone [data-key="collect"] .vz-legend__vals { flex-direction:row; flex-wrap:wrap; gap:0 8px; font-size:12px; }
.page--phone [data-key="collect"] .vz-legend__vals small { min-width:0; margin-right:4px; }
.page--phone .vz-legend__item[data-state="pending"] .vz-legend__name b {
  white-space:normal; word-break:normal; overflow-wrap:anywhere; text-overflow:clip;
}
.page--phone [data-key="battery"] .grp__figs { grid-template-columns:repeat(5,minmax(0,1fr)); }
.live-offline.page--phone .phone-details:empty, .live-offline .page--phone .phone-details:empty { display:none; }
.live-offline .page--phone .mach__pt { background:transparent; box-shadow:none; border:1px solid var(--muted); }
.page--phone .phone-changes { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px 32px; }
.page--phone .phone-changes > .use-note { margin:0; padding:8px 0; border-bottom:1px solid var(--hair); }
.page--phone .phone-changes > details { grid-column:1 / -1; }
.page--phone .phone-changes__side { display:grid; gap:14px; align-content:start; }
.page--phone .phone-changes__side > .use-note { margin:0; }
.page--phone [data-key="storage"] .vz-share { grid-template-columns:170px minmax(280px,500px); justify-content:start; }
.page--phone .grp__acts { position:absolute; top:16px; right:18px; }
.page--phone [data-key="usage"] .use-two { grid-template-columns:minmax(0,39fr) minmax(0,61fr); gap:22px; }
.page--phone [data-key="usage"] .use-two.is-compact { grid-template-columns:minmax(0,1fr) minmax(240px,.8fr); max-width:820px; gap:24px; }
.page--phone [data-key="usage"] .use-two:not(.is-compact) .vz-share { grid-template-columns:120px minmax(0,1fr); gap:5px; }
.page--phone [data-key="usage"] .use-two:not(.is-compact) .vz-share__ring { width:120px; }
.page--phone [data-key="usage"] .vz-share__mid b { font-size:17px; }
.page--phone [data-key="usage"] .vz-share__mid small { font-size:10px; margin-inline:1px 0; }
.page--phone [data-key="usage"] .vz-share__mid span { max-width:7em; font-size:11px; text-wrap:balance; }
.page--phone [data-key="usage"] .vz-share__row { grid-template-columns:8px minmax(0,1fr) auto minmax(22px,max-content); column-gap:5px; }
.page--phone [data-key="usage"] .vz-share__name { overflow-wrap:anywhere; }
.page--phone .use-two.is-compact .vz-share { grid-template-columns:140px minmax(0,1fr); gap:18px; }
.page--phone .use-two.is-compact .vz-share__ring { width:140px; }
.page--phone [data-key="usage"] .vz-legend { grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px 24px; }

.page--phone [data-key="usage"] .vz-legend__vals > span:not(.vz-legend__big) { display:grid; grid-template-columns:auto minmax(0,1fr); column-gap:.3em; align-items:baseline; }
.page--phone .phone-days__plot { position:relative; height:220px; margin-top:6px; touch-action:none; }
.page--phone .phone-days__plot.is-empty { height:64px; }
.page--phone .phone-days__plot > svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
.page--phone .phone-days__plot > .vz-wait { position:absolute; inset:0; display:grid; place-items:center; padding:0; }
.page--phone .phone-days__hl { fill:rgb(20 20 19 / .045); }
.page--phone .phone-days__x { display:flex; margin-top:6px; }
.page--phone .phone-days__lab { flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; font-size:13px; line-height:18px; letter-spacing:.02em; color:#68665f; font-variant-numeric:tabular-nums; white-space:nowrap; transition:color calc(150ms * var(--sp)) ease; }
.page--phone .phone-days__lab.is-on { color:var(--ink); }
.page--phone .phone-days__lab > small { font-size:12px; color:#68665f; }
.page--phone .phone-days__lanes { display:flex; gap:var(--gap); margin-bottom:2px; }
.page--phone .phone-days__lanes small { width:var(--bw); font-size:12px; text-align:center; color:#68665f; }

.page--phone .phone-days__tip small { margin-top:5px; font-size:12px; color:#68665f; }
.page--phone .phone-days__tip span { display:flex; }
.page--phone .phone-days__tip em { margin-left:auto; padding-left:16px; font-style:normal; color:var(--ink); }
.page--phone .phone-days__note { margin-top:10px; }
.page--phone [data-key="usage"] .vz-heat__cell { height:12px; }
.page--phone .phone-battery-overlay { display:grid; padding-right:54px; }
.page--phone .phone-battery-overlay > .phone-chart { grid-area:1 / 1; }
.page--phone .phone-battery-overlay .chart__head { min-height:26px; }
.page--phone .phone-battery-overlay > .phone-chart:first-child .chart__vals { margin-left:12px; margin-right:auto; }
.page--phone .phone-temp { pointer-events:none; }
.page--phone .phone-temp > h3 { visibility:hidden; }
.page--phone .phone-temp .chart__name { display:none; }
.page--phone .phone-temp .chart__head { justify-content:flex-end; }
.page--phone .phone-temp :is(.chart__grid,.chart__x,.chart__area,.chart__band,.chart__tip) { display:none; }
.page--phone .phone-temp .chart__y { left:100%; margin-left:8px; text-align:left; }
.page--phone .phone-temp .chart__stroke { stroke-width:1.2; }
.page--phone .phone-temp .chart__wait { right:0; left:auto; max-width:45%; }
.page--phone [data-key="network"] .phone-details { grid-template-columns:minmax(0,1fr); margin-inline:12px; }
.page--phone [data-key="network"] .phone-details > div { display:grid; grid-template-columns:minmax(130px,1fr) minmax(0,2fr); }
.page--phone [data-key="storage"] .grp__figs { grid-template-columns:.8fr 1.2fr 1.2fr .8fr; }
.page--phone [data-key="storage"] [data-figure-gap] { margin:4px 0 0; letter-spacing:0; text-wrap:pretty; }
.page--phone [data-key="apps"] .grp__line { flex-direction:column; gap:3px; }
.page--phone [data-key="apps"] :is(.grp__said,.grp__status,.grp__cutoff) { white-space:normal; overflow:visible; max-width:none; margin-left:0; }
.page--phone :is([data-key="battery"],[data-key="storage"]) .grp__line { flex-wrap:wrap; gap:3px 8px; }
.page--phone :is([data-key="battery"],[data-key="storage"]) :is(.grp__said,.grp__status) { white-space:normal; overflow:visible; }
.page--phone :is([data-key="battery"],[data-key="storage"]) .grp__cutoff { flex:none; max-width:100%; overflow:visible; white-space:normal; }
@media (max-width:1350px) {
  .page--phone [data-key="usage"] :is(.use-two,.use-two.is-compact) { grid-template-columns:minmax(0,1fr); }
}
@media (max-width:600px) {
  .page--phone [data-key="storage"] .vz-share { grid-template-columns:minmax(0,1fr); }

  .page--phone [data-key="collect"] .vz-legend { grid-template-columns:repeat(2,minmax(0,1fr)); }
