      <header><h2 id="task-prompt-title">到点做什么</h2></header>
      <dl id="task-prompt-facts"></dl>
    </section>
    <dl class="task-stats" id="task-stats"></dl>
    <section class="glass task-card task-failure" id="failure" hidden>

        </div>
        <p class="task-reading" id="run-coverage" hidden></p>
      </section>
      <aside class="task-aside">
        <section class="glass task-card" id="future" hidden>
          <header><span class="lb-card__badge" data-icon-name="moon"></span><h2>接下来 3 次</h2></header>
          <ol id="future-runs"></ol><p class="task-reading" id="future-note" hidden></p>
        </section>
        <section class="glass task-card task-about" id="about">
          <header><span class="lb-card__badge" data-icon-name="gear"></span><h2 id="about-title">这个任务</h2></header>
          <dl id="facts"></dl>
        </section>
      </aside>
    </div>
