<style>
.page--usage .traffic-range { justify-content:flex-start; margin:32px 0 28px; }
.page--usage #usage-range { margin:0; padding:4px; gap:8px; align-items:center; min-height:0; }
.page--usage #usage-range button { min-width:148px; height:44px; padding:0 22px; font-size:17px; line-height:1; }
.page--usage .grp .card__pic { mask-image:linear-gradient(90deg,transparent,#000 30%); -webkit-mask-image:linear-gradient(90deg,transparent,#000 30%); }
.page--usage .vz-share__mid > span { max-width: 100%; line-height: 16px; letter-spacing: 0; color:var(--muted); }
.page--usage .vz-share__mid em { line-height: 1.1; }
.page--usage .vz-share__mid b { font-size: 20px; }
.page--usage .vz-tl__label { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.page--usage #hero .usage-odd { margin: 18px 0 0; padding-top: 14px; border-top: 1px solid var(--hair); }
.page--usage .year-row { grid-template-columns: minmax(0, 1fr) 190px; gap: 24px; max-width: 960px; }
.page--usage .vz-cal__months { --cal-cell: 24px; grid-template-columns: repeat(auto-fit, minmax(188px, 1fr)); gap: 20px 24px; }
.page--usage .vz-cal__grid { grid-template-rows: repeat(7, var(--cal-cell)); grid-auto-columns: var(--cal-cell); }
.page--usage .vz-cal__dot { width: var(--cal-cell); height: var(--cal-cell); }
.page--usage .use-cal__week { grid-template-rows: repeat(7, var(--cal-cell)); line-height: var(--cal-cell); }
.page--usage .year-row .vz-heat__key { justify-content: center; margin-top: 18px; }
/* 月历图例：每种颜色旁边都看得到对应的色块（灰点、空心圈画大一点、深一点，日历里同样） */
.page--usage .year-row .vz-heat__key { flex-wrap: wrap; gap: 6px 18px; }
.page--usage .use-key__part { display: inline-flex; align-items: center; gap: 4px; }
.page--usage .year-row .vz-heat__key .vz-cal__dot { width: 14px; height: 14px; border-radius: 50%; }
.page--usage .vz-cal__dot.is-zero { background: rgb(20 20 19 / .1); }
.page--usage .vz-cal__dot.is-none { box-shadow: inset 0 0 0 1.5px rgb(20 20 19 / .2); }
.page--usage .year-sum { padding-left: 22px; }
.page--usage .use-days .chart__head { display: grid; grid-template-columns: 1fr; gap: 8px; min-height: 58px; }
.page--usage .use-days .chart__vals { justify-content: flex-start; flex-wrap: wrap; gap: 8px 14px; }
.page--usage .use-days .vz-bars__plot { height: 190px; }
.page--usage .use-days .use-compare-key { margin-left: 46px; }
.page--usage .use-days:has([data-x="cmp"] .vz-bars__plot.is-empty) { grid-template-columns: minmax(0,1fr); gap: 16px; }
.page--usage [data-x="cmp"]:has(.vz-bars__plot.is-empty) { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; padding-top: 12px; border-top: 1px solid var(--hair); }
.page--usage [data-x="cmp"]:has(.vz-bars__plot.is-empty) .chart__head { display: block; min-height: 0; }
.page--usage [data-x="cmp"] .vz-bars__plot.is-empty { height: auto; }
.page--usage [data-x="cmp"] .vz-bars__plot.is-empty > :not(.vz-wait),
.page--usage [data-x="cmp"]:has(.vz-bars__plot.is-empty) :is(.vz-bars__x, .chart__vals) { display: none; }
.page--usage [data-x="cmp"] .vz-bars__plot.is-empty .vz-wait { position: static; display: block; padding: 0; text-align: left; }
.page--usage .use-where { display: grid; grid-template-columns: minmax(0,1fr); gap: 24px; }
.page--usage [data-key="where"] .card__pic {
  bottom: auto;
  height: min(520px, 100%);
  mask-image: linear-gradient(90deg, transparent, #000 30%), linear-gradient(180deg, #000 72%, transparent);
  mask-composite: intersect;
}
.page--usage .use-windows { padding-top: 20px; border-top: 1px solid var(--hair); }
.page--usage .use-where .vz-share { grid-template-columns:170px minmax(0,1fr); gap:20px; align-items:start; }
.page--usage .use-where .vz-share__ring { justify-self:center; }
/* 两栏只在宽窗口排：1024 宽时圆环右边只剩约 400 像素，再分两栏类别名会被挤成一字一行（M499） */
@media (min-width: 1280px) {
  .page--usage .use-where :is(.vz-share__list, .vz-rank__list):has(> :nth-child(7)) {
    columns: 2;
    column-gap: 28px;
  }
  .page--usage .use-where :is(.vz-share__row, .vz-rank__row) { break-inside: avoid; }
}
.page--usage .use-where :is(.vz-share__row,.vz-rank__row) { display:grid; grid-template-columns:32px minmax(0,1fr) 88px 42px; column-gap:11px; min-height:44px; margin-block:4px; padding:5px 0; align-items:center; }
.page--usage .use-where :is(.vz-share__name,.vz-rank__name) { grid-column:2; min-width:0; overflow-wrap:anywhere; }
.page--usage .use-where .vz-rank__name { display:block; }
.page--usage .use-where .vz-rank__name small { display:block; margin:4px 0 0; }
.page--usage .use-where :is(.vz-share__v,.vz-rank__v) { grid-column:3; text-align:right; font-variant-numeric:tabular-nums; }
.page--usage :is(.vz-share__pct,.use-rank-pct) { grid-column:4; text-align:right; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }
.page--usage .use-where :is(.vz-rank__row--private,.vz-rank__row--empty) { display:block; }
.page--usage .use-windows .vz-rank__row { grid-template-columns: minmax(0,1fr) 88px 42px; }
.page--usage .use-windows .vz-rank__name { grid-column: 1; }
/* 窗口标题排行：窗口名整句显示，放不下就换行，不截成“…”（M760） */
.page--usage .use-windows :is(.vz-rank__name, .vz-rank__label) { white-space: normal; overflow: visible; text-overflow: clip; overflow-wrap: anywhere; }
.page--usage .use-windows .vz-rank__v { grid-column: 2; }
.page--usage .use-windows .use-rank-pct { grid-column: 3; }
.page--usage .use-windows .vz-rank__row--private { min-height: 0; }
.page--usage [data-key="day"] .vz-tl:has(.vz-tl__plot:not(.is-empty)) { padding-top: 32px; }
.page--usage [data-key="day"] .vz-tl__row { grid-template-columns:116px minmax(0,1fr); }
.page--usage [data-key="day"] .vz-tl__row + .vz-tl__row { margin-top: 32px; }
.page--usage [data-key="day"] .vz-tl__label { white-space:normal; line-height:20px; font-variant-numeric:tabular-nums; }
.page--usage [data-key="day"] .vz-tl__plot { height:28px; }
.page--usage [data-key="day"] .vz-tl__halo { display:none; }
.page--usage [data-key="day"] .vz-tl__cursor { top:2px; bottom:2px; box-shadow:inset 0 0 0 2px rgb(20 20 19 / .65), inset 0 0 0 3px rgb(255 255 255 / .85); }
.page--usage [data-key="day"] .vz-legend { margin-left:130px; grid-template-columns:repeat(3,minmax(0,1fr)); }
.page--usage [data-key="day"] .vz-legend__vals > span { display:flex; align-items:baseline; gap:8px; white-space:nowrap; }
.page--usage [data-key="day"] .vz-legend__vals small { min-width:92px; }
.page--usage [data-key="day"] .vz-tl__row:not([data-row="day2"]) .is-now { display:none; }
.page--usage [data-x="sw"] .chart__head { justify-content: flex-start; gap: 18px; }
.page--usage [data-x="sw"] .chart__vals { margin-left: 0; }
.page--usage .grp__status { font-size: 13px; font-weight: 400; color: var(--muted); }
/* 用在哪：统计起止和下面那句说明要看全，换行不截成省略号（M499） */
.page--usage .grp[data-key="where"] .grp__line { flex-wrap: wrap; }
.page--usage .grp[data-key="where"] :is(.grp__said, .grp__status, .grp__cutoff) { white-space: normal; overflow: visible; text-overflow: clip; overflow-wrap: anywhere; }
.page--usage .use-focus-key:empty { display:none; }
.page--usage .use-recent { margin-top:20px; padding-top:16px; border-top:1px solid var(--hair); }
.page--usage .focus-track__tick { color:var(--muted); }
.page--usage [data-x="recent"] .vz-rank__name { display:block; white-space:normal; }
.page--usage [data-x="recent"] .vz-rank__name small { display:block; margin:4px 0 0; overflow-wrap:anywhere; }
@media (max-width:600px) {
  .page--usage :is(.use-two,.year-row) { grid-template-columns:minmax(0,1fr); }
  .page--usage .vz-cal__months { --cal-cell: 18px; grid-template-columns:repeat(auto-fit,minmax(146px,1fr)); }
}
</style>

.page--usage [data-key="union"] .vz-tl__plot { height:20px; }
