<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="680" height="500" role="img"><title>资料备份怎么走：原件每天更新到热备，移动硬盘插上解锁后从热备复制到冷备；原件增改删备份跟着变、删掉的不往回拷、留 30 天后悔期；源头一部分异常时冷备保留那部分旧副本，这一轮报部分完成；碰上放不下的大文件就跳过这一个，其余照常备完，实况上写明跳过了什么</title><path class="v-l v-l--dash" d="M160,47 L326,47"/><path class="v-l v-l--dash" d="M374,47 L551,47"/><text x="243" y="38" class="v-g" text-anchor="middle">每天跟着原件更新</text><circle class="v-o" cx="462.5" cy="47" r="4.6"/><text x="462.5" y="38" class="v-g" text-anchor="middle">插上并解锁后，从热备复制一份</text><rect class="v-ico" x="108" y="33" width="44" height="28" rx="3.5"/><path class="v-l" d="M130,61 L130,68"/><path class="v-l" d="M120,69 L140,69"/><rect class="v-ico" x="332" y="35" width="36" height="24" rx="4"/><circle class="v-p" cx="360" cy="52" r="1.9"/><rect class="v-ico" x="557" y="35" width="36" height="24" rx="4"/><circle class="v-p" cx="585" cy="52" r="1.9"/><text x="130" y="92" class="v-t v-t--b" text-anchor="middle">原件</text><text x="130" y="108" class="v-g" text-anchor="middle">电脑上</text><text x="350" y="92" class="v-t v-t--b" text-anchor="middle">热备</text><text x="350" y="108" class="v-g" text-anchor="middle">电脑的另一块固态硬盘</text><text x="575" y="92" class="v-t v-t--b" text-anchor="middle">冷备</text><text x="575" y="108" class="v-g" text-anchor="middle">一块移动硬盘，平时收起来</text><path class="v-l" style="stroke:var(--v-faint);stroke-width:1" d="M350,121 v5 H575 v-5"/><text x="462.5" y="144" class="v-g" text-anchor="middle">两处都由计划任务按时自己跑，都有 BitLocker 保护</text><path class="v-sep" d="M28,166 L652,166"/><text x="28" y="200.5" class="v-t v-t--b">增了、改了</text><text x="28" y="244.5" class="v-t v-t--b">删了</text><text x="28" y="288.5" class="v-t v-t--b">反过来</text><path class="v-l" d="M130,196 L350,196"/><path class="v-l" d="M130,240 L350,240"/><rect class="v-fill-p" x="362" y="233" width="172" height="14" rx="3"/><path class="v-l" d="M206,277 L206,291"/><path class="v-l" d="M212,284 L350,284"/><circle class="v-p" cx="130" cy="196" r="5"/><circle class="v-p" cx="130" cy="240" r="5"/><circle class="v-o" cx="540" cy="240" r="4"/><circle class="v-p" cx="350" cy="196" r="6"/><circle class="v-p" cx="350" cy="240" r="6"/><circle class="v-p" cx="350" cy="284" r="6"/><text x="240" y="188" class="v-g" text-anchor="middle">原件变了</text><text x="364" y="200.5" class="v-t">备份跟着变</text><text x="240" y="232" class="v-g" text-anchor="middle">原件删掉</text><text x="364" y="227" class="v-g">照片、视频、音乐和个人资料</text><text x="448" y="244" class="v-g" text-anchor="middle">留 30 天后悔期</text><text x="552" y="244.5" class="v-t">过后跟着删</text><text x="130" y="288.5" class="v-t" text-anchor="middle">原件已经删掉</text><text x="281" y="276" class="v-g" text-anchor="middle">不往回拷</text><text x="364" y="288.5" class="v-t">备份里还有</text><path class="v-sep" d="M28,316 L652,316"/><text x="28" y="389" class="v-t v-t--b">冷备的同一轮</text><text x="28" y="405" class="v-g">三组资料，示意</text><path class="v-l" d="M575,352 L575,464"/><path class="v-l" d="M350,352 L575,352"/><path class="v-l" style="stroke:var(--v-faint);stroke-width:1" d="M358,392 L440,392"/><path class="v-l" d="M446,385 L446,399"/><path class="v-l" d="M350,432 L369,432 A13,13 0 0 1 395,432 L575,432"/><rect x="375" y="427" width="14" height="10" rx="2" style="fill:var(--v-faint)"/><circle class="v-p" cx="350" cy="352" r="6"/><circle cx="350" cy="392" r="6" style="fill:var(--v-faint)"/><circle class="v-p" cx="575" cy="352" r="6"/><circle class="v-p" cx="575" cy="392" r="6"/><circle class="v-p" cx="350" cy="432" r="6"/><circle class="v-p" cx="575" cy="432" r="6"/><text x="336" y="356.5" class="v-g" text-anchor="end">源头这部分正常</text><text x="248" y="356.5" class="v-t v-t--b" text-anchor="end">照片</text><text x="336" y="396.5" class="v-g" text-anchor="end">源头这部分异常</text><text x="248" y="396.5" class="v-t v-t--b" text-anchor="end">文档</text><text x="462.5" y="344" class="v-g" text-anchor="middle">照常备</text><text x="398" y="382" class="v-g" text-anchor="middle">不拿坏的覆盖好的</text><text x="589" y="356.5" class="v-t">换成新副本</text><text x="589" y="396.5" class="v-t">保留旧副本</text><text x="336" y="436.5" class="v-g" text-anchor="end">大文件放不下</text><text x="248" y="436.5" class="v-t v-t--b" text-anchor="end">视频</text><text x="482" y="424" class="v-g" text-anchor="middle">跳过这一个，其余照常备完</text><text x="589" y="428.5" class="v-t">实况上写明</text><text x="589" y="445" class="v-t">跳过了什么</text><text x="575" y="482" class="v-t v-t--b" text-anchor="middle">这一轮如实报“部分完成”</text></svg>
