<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 178" width="680" height="178" role="img"><title>钩子挂在一次对话的五个时点上</title><path class="v-l" d="M108,60 L606,60"/><text x="28" y="64.5" class="v-t v-t--b">一次对话</text><path class="v-l v-l--dot" d="M126,67 L126,148"/><circle class="v-p" cx="126" cy="60" r="6"/><text x="126" y="45" class="v-t" text-anchor="middle">开场</text><text x="137" y="92" class="v-g">补进北京时间、</text><text x="137" y="108" class="v-g">型号和档位、</text><text x="137" y="124" class="v-g">个人资料的状态</text><text x="137" y="140" class="v-g">和规则的位置</text><path class="v-l v-l--dot" d="M236,67 L236,132"/><circle class="v-p" cx="236" cy="60" r="6"/><text x="236" y="45" class="v-t" text-anchor="middle">新消息</text><text x="247" y="92" class="v-g">连发几条消息，</text><text x="247" y="108" class="v-g">列出清单，</text><text x="247" y="124" class="v-g">催它一条条回应</text><path class="v-l v-l--dot" d="M346,67 L346,116"/><circle class="v-p" cx="346" cy="60" r="6"/><text x="346" y="45" class="v-t" text-anchor="middle">工具调用前后</text><text x="357" y="92" class="v-g">危险的清理之前</text><text x="357" y="108" class="v-g">核对范围</text><path class="v-l v-l--dot" d="M456,67 L456,148"/><circle class="v-p" cx="456" cy="60" r="6"/><text x="456" y="45" class="v-t" text-anchor="middle">压缩</text><text x="467" y="92" class="v-g">递上这项工程</text><text x="467" y="108" class="v-g">《他要什么》的</text><text x="467" y="124" class="v-g">位置，先读它</text><text x="467" y="140" class="v-g">再接着做</text><path class="v-l v-l--dot" d="M566,67 L566,148"/><circle class="v-p" cx="566" cy="60" r="6"/><text x="566" y="45" class="v-t" text-anchor="middle">停止</text><text x="577" y="92" class="v-g">只查三样：</text><text x="577" y="108" class="v-g">资料锁拦下的、</text><text x="577" y="124" class="v-g">后台没人盯的、</text><text x="577" y="140" class="v-g">回复用了英文</text></svg>
