<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 256" width="680" height="256" role="img"><title>谁做什么：我们、主持的 Opus、Sol 和程序</title><path class="v-l" d="M44,42 L44,218"/><circle class="v-w" cx="44" cy="42" r="6"/><text x="62" y="46.5" class="v-t v-t--b">我们</text><text class="v-t" text-anchor="start"><tspan x="172" y="46.5">开口交办；最后看分阶段的真实结果</tspan></text><circle class="v-a" cx="44" cy="88" r="6"/><text x="62" y="92.5" class="v-t v-t--b">主持的 Opus</text><text class="v-t" text-anchor="start"><tspan x="172" y="92.5">听懂我们的话，定范围和取舍，读录音里说了什么，判断材料对我们的意义，</tspan><tspan x="172" y="111.5">改个人理解，验收，写给我们的每一句话</tspan></text><circle class="v-a" cx="44" cy="153" r="6"/><text x="62" y="157.5" class="v-t v-t--b">Sol</text><text class="v-t" text-anchor="start"><tspan x="172" y="157.5">连手机，跑保全、清空和回写的程序，成批读图初筛，去重和核对，导入，</tspan><tspan x="172" y="176.5">修脚本，浏览器里的网页操作</tspan></text><circle class="v-p" cx="44" cy="218" r="6"/><text x="62" y="222.5" class="v-t v-t--b">程序</text><text class="v-t" text-anchor="start"><tspan x="172" y="222.5">连接、复制、校验、调度、提醒，并在关键时点拦一下</tspan></text></svg>
