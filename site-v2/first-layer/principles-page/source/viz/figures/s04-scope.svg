<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 246" width="680" height="246" role="img"><title>资料解锁竖着盖住所有入口，无限制授权只横在一个对话上</title><rect class="v-fill-we" x="300" y="58" width="110" height="140" rx="6"/><path class="v-l" d="M120 78h336m64 0h132"/><path class="v-l" d="M120,128 L652,128"/><path class="v-l" d="M120,178 L652,178"/><path class="v-l v-l--we" d="M185,69 H557 A9,9 0 0 1 557,87 H185 A9,9 0 0 1 185,69 Z"/><circle class="v-w" cx="185" cy="78" r="6"/><circle class="v-w" cx="300" cy="198" r="6"/><circle class="v-o" cx="360" cy="198" r="5.4"/><circle class="v-p" cx="410" cy="198" r="6"/><text x="176" y="48" class="v-t v-t--b">无限制授权</text><text x="176" y="63" class="v-g">开的时候验证一次</text><text x="355" y="48" class="v-t v-t--b" text-anchor="middle">资料解锁</text><text x="566" y="48" class="v-t" text-anchor="end">到期</text><text x="566" y="63" class="v-g" text-anchor="end">后台的活立即叫停</text><text x="488" y="82" class="v-g s4-expiry" text-anchor="middle">重启也到期</text><text x="488" y="104" class="v-g" text-anchor="middle">资料锁另算</text><text x="288" y="202.5" class="v-g" text-anchor="end">验证一次</text><text class="v-g" text-anchor="middle"><tspan x="360" y="220">关机或断电</tspan><tspan x="360" y="234">自动锁回</tspan></text><text x="422" y="202.5" class="v-g">到点一起锁回</text><text x="28" y="82.5" class="v-t v-t--b">一个对话</text><text x="28" y="132.5" class="v-t v-t--b">别的对话</text><text x="28" y="182.5" class="v-t v-t--b">远程入口</text></svg>
