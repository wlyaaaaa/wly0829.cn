<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 384" width="900" height="384" role="img" aria-labelledby="s08r-title s08r-desc">
  <title id="s08r-title">一件毛病怎么修好</title>
  <desc id="s08r-desc">程序每 5 分钟收一遍程序报的错，没有新报错不开模型。急的马上修，其余早上 6:10 起一件一件修，都交给 Sol 修到根上。原来报错的程序交回正常回执就算修好；没有回执可看的，另开一个没看过这件活的 Sol 验，验过算修好，没过再修。没修好就再修一轮，同一件修两轮还不好，登一张“要你选”问我们。一轮最多 1 小时，一天的 AI 时间用满 4 小时就停，之后只修急的。</desc>

  <!-- 电脑和收报错的程序 -->
  <rect class="v-ico" x="28" y="56" width="44" height="28" rx="3.5"/>
  <path class="v-l" d="M50,84 L50,91"/>
  <path class="v-l" d="M40,92 L60,92"/>
  <text x="50" y="112" class="v-t" text-anchor="middle">电脑</text>
  <path class="v-l v-l--dash" d="M72,70 L164,70"/>
  <text x="118" y="60" class="v-g" text-anchor="middle">每 5 分钟收一遍</text>
  <circle class="v-p" cx="170" cy="70" r="6"/>
  <text x="170" y="94" class="v-t" text-anchor="middle">程序</text>
  <text x="170" y="112" class="v-g" text-anchor="middle">收程序报的错</text>
  <text x="170" y="127" class="v-g" text-anchor="middle">没有新报错就不开模型</text>

  <!-- 急的马上修，其余早上 6:10 起 -->
  <path class="v-l" d="M176,70 L454,70"/>
  <text x="320" y="44" class="v-g" text-anchor="middle">备份停了、磁盘快满、实况挂了</text>
  <text x="320" y="60" class="v-t" text-anchor="middle">急的，马上修</text>
  <path class="v-l v-l--dash" d="M240,70 Q250,70 250,80 L250,140 Q250,150 260,150 L314.6,150 M325.4,150 L380,150 Q390,150 390,140 L390,80 Q390,70 400,70"/>
  <circle class="v-o" cx="320" cy="150" r="5.4"/>
  <text x="320" y="174" class="v-t" text-anchor="middle">早上 6:10 起</text>
  <text x="320" y="191" class="v-g" text-anchor="middle">其余一件一件修</text>

  <!-- Sol 修 -->
  <circle class="v-a" cx="460" cy="70" r="6"/>
  <text x="472" y="94" class="v-t">Sol 修到根上</text>
  <text x="472" y="112" class="v-g">先看是不是已经自己好了，</text>
  <text x="472" y="127" class="v-g">值得修的才交给它</text>

  <!-- 看回执，修好了 -->
  <path class="v-l" d="M466,70 L624,70"/>
  <circle class="v-p" cx="630" cy="70" r="6"/>
  <text x="630" y="54" class="v-t" text-anchor="middle">看回执</text>
  <path class="v-l" d="M636,70 L844.6,70"/>
  <text x="740" y="60" class="v-g" text-anchor="middle">原来报错的程序交回正常的回执</text>
  <circle class="v-o" cx="850" cy="70" r="5.4"/>
  <text x="850" y="54" class="v-t" text-anchor="middle">修好了</text>

  <!-- 没有回执可看：另开 Sol 验 -->
  <path class="v-l" d="M630,143 Q630,150 637,150 L734,150"/>
  <text x="685" y="140" class="v-g" text-anchor="middle">没有回执可看</text>
  <circle class="v-a" cx="740" cy="150" r="6"/>
  <text x="754" y="174" class="v-t">另开一个 Sol 验</text>
  <text x="754" y="192" class="v-g">没看过这件活的</text>
  <text x="754" y="207" class="v-g">要等下一次备份这类的，</text>
  <text x="754" y="222" class="v-g">到时再验</text>
  <path class="v-l" d="M746,150 L843,150 Q850,150 850,143 L850,75.4"/>
  <text x="800" y="140" class="v-g" text-anchor="middle">验过</text>

  <!-- 没修好，再修一轮；两轮还不好问我们 -->
  <path class="v-l" d="M630,76 L630,233 Q630,240 623,240 L467,240 Q460,240 460,233 L460,76"/>
  <path class="v-l" d="M740,156 L740,233 Q740,240 733,240 L630,240"/>
  <text x="730" y="210" class="v-g" text-anchor="end">没过</text>
  <text x="545" y="230" class="v-g" text-anchor="middle">没修好，再修一轮</text>
  <path class="v-l" d="M530,240 L530,300"/>
  <text x="518" y="276" class="v-g" text-anchor="end">同一件修两轮还不好</text>
  <circle class="v-w" cx="530" cy="306" r="6"/>
  <text x="544" y="310.5" class="v-t">登一张“要你选”问我们</text>

  <path class="v-sep" d="M28,338 L872,338"/>
  <text x="450" y="364" class="v-t" text-anchor="middle">一轮最多 1 小时，一天的 AI 时间用满 4 小时就停，之后只修急的</text>
</svg>
