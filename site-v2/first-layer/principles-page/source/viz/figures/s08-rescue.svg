<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 548" width="680" height="548" role="img"><title>人不在跟前，电脑坏到哪一步还救得回来：入口断了、停在登录界面由 AI 远程维护，卡死、关着由我们断电重启或远程开机，彻底失联由云端报信；维护命令先领编号，断线后查回结果不重发</title><rect class="v-fill-we" x="12" y="180" width="656" height="132" rx="6"/><text x="64" y="30" class="v-g">坏成什么样（越往下越重）</text><text x="278" y="30" class="v-g">靠什么救</text><path class="v-l" d="M44,62 L44,352"/><path class="v-l v-l--we" d="M38,242 H32 Q24,242 24,234 V132 Q24,124 32,124 H38"/><path class="v-l v-l--we" d="M38,202 H24"/><path class="v-l" d="M222,62 L256,62"/><path class="v-l" d="M222,124 L256,124"/><path class="v-l" d="M222,202 L256,202"/><path class="v-l" d="M222,242 L256,242"/><path class="v-l" d="M222,352 L256,352"/><circle class="v-o" cx="44" cy="62" r="5.4"/><circle class="v-o" cx="44" cy="124" r="5.4"/><circle class="v-o" cx="44" cy="202" r="5.4"/><circle class="v-o" cx="44" cy="242" r="5.4"/><circle class="v-o" cx="44" cy="352" r="5.4"/><circle class="v-a" cx="262" cy="62" r="6"/><circle class="v-a" cx="262" cy="124" r="6"/><circle class="v-w" cx="262" cy="202" r="6"/><circle class="v-w" cx="262" cy="242" r="6"/><circle class="v-p" cx="262" cy="352" r="6"/><text x="64" y="66.5" class="v-t v-t--b">台式机的公网主入口断了</text><text x="278" y="66.5" class="v-t">改走笔记本上的备用入口，AI 接着维护</text><text x="278" y="83" class="v-g">请求经两台电脑之间的 Tailscale 私有网络转回台式机</text><text x="64" y="128.5" class="v-t v-t--b">重启后停在登录界面</text><text x="278" y="128.5" class="v-t">AI 也能远程维护网络和后台服务</text><text x="278" y="145" class="v-g">“电脑远程控制”开机就作为系统服务运行，不等人登录</text><text x="278" y="160" class="v-g">维护命令交给管理员或系统级的任务执行</text><text x="64" y="206.5" class="v-t v-t--b">卡死</text><text x="278" y="206.5" class="v-t">我们用智能插座断电重启</text><text x="64" y="246.5" class="v-t v-t--b">关着</text><text x="278" y="246.5" class="v-t">我们远程开机</text><text x="278" y="263" class="v-g">办法类似网络唤醒</text><text x="278" y="284" class="v-g">两种都回到登录界面，就能连上 AI 和远程桌面</text><text x="278" y="299" class="v-g">远程桌面用的是 ToDesk、UU 远程和 Moonlight</text><text x="64" y="356.5" class="v-t v-t--b">彻底断电断网</text><text x="64" y="373" class="v-g">自己发不出提醒</text><text x="278" y="356.5" class="v-t">云端发现，给我们报信</text><text x="278" y="373" class="v-g">Google Apps Script 每 10 分钟看一次电脑</text><text x="278" y="388" class="v-g">失联 20 分钟就发邮件</text><path class="v-sep" d="M28,408 L652,408"/><text x="28" y="436" class="v-t v-t--b">连接中途断了，同一项改动也不做两遍</text><path class="v-l v-l--ai" d="M540,486 L540,466 Q540,458 532,458 L244,458 Q236,458 236,466 L236,486"/><text x="388" y="450" class="v-t" text-anchor="middle">重连后拿原编号查回结果，不重发</text><path class="v-l" d="M96,492 L377,492"/><path class="v-l" d="M395,492 L540,492"/><path class="v-l" d="M379,499 L385,485 M387,499 L393,485"/><circle class="v-p" cx="96" cy="492" r="6"/><circle class="v-p" cx="236" cy="492" r="6"/><circle class="v-a" cx="540" cy="492" r="6"/><text x="96" y="516" class="v-t" text-anchor="middle">领编号</text><text x="96" y="531" class="v-g" text-anchor="middle">维护命令先领编号再执行</text><text x="236" y="516" class="v-t" text-anchor="middle">执行</text><text x="236" y="531" class="v-g" text-anchor="middle">每个编号只执行一次</text><text x="386" y="516" class="v-t" text-anchor="middle">连接断了</text><text x="386" y="531" class="v-g" text-anchor="middle">或改走备用入口</text><text x="540" y="516" class="v-t" text-anchor="middle">AI 没收到结果</text><text x="540" y="531" class="v-g" text-anchor="middle">不当成没执行</text></svg>
