<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 398" width="680" height="398" role="img"><title>开口到动手，AI 手里依次多了什么</title><path class="v-l" d="M24,34 L24,264"/><path class="v-l v-l--ai" d="M24,264 L24,344"/><circle class="v-p" cx="24" cy="34" r="5.5"/><text x="44" y="32" class="v-t v-t--b">入口文件</text><text x="44" y="48" class="v-g">约法、导航、自家容易错的</text><rect class="v-fill-p" x="262" y="18" width="406" height="32" rx="4"/><text x="274" y="38.5" class="v-t">“我的 AI 约法 ……　Claude 容易错的（主持时）……”</text><circle class="v-p" cx="24" cy="80" r="5.5"/><text x="44" y="78" class="v-t v-t--b">开场钩子</text><text x="44" y="94" class="v-g">只回一行：版本对不对</text><rect class="v-fill-p" x="262" y="64" width="406" height="32" rx="4"/><text x="274" y="84.5" class="v-t">“[活动规则已核验] E442：约法已在入口里”</text><circle class="v-p" cx="24" cy="126" r="5.5"/><text x="44" y="124" class="v-t v-t--b">技能清单</text><text x="44" y="140" class="v-g">每个技能一句，用到才读全文</text><rect class="v-fill-p" x="262" y="110" width="406" height="32" rx="4"/><text x="274" y="130.5" class="v-t">“report-page：长回答用本地汇报网页”</text><circle class="v-w" cx="24" cy="172" r="5.5"/><text x="44" y="170" class="v-t v-t--b">我们说一句</text><text x="44" y="186" class="v-g">不用报项目名</text><rect class="v-fill-we" x="262" y="156" width="406" height="32" rx="4"/><text x="274" y="177" class="v-q">“看看原理页要不要更新”</text><circle class="v-p" cx="24" cy="218" r="5.5"/><text x="44" y="216" class="v-t v-t--b">新消息钩子</text><text x="44" y="232" class="v-g">补上时间和状态</text><rect class="v-fill-p" x="262" y="202" width="406" height="32" rx="4"/><text x="274" y="222.5" class="v-t">“资料已解锁，截止 11-18 13:40　北京时间 08:33”</text><circle class="v-a" cx="24" cy="264" r="5.5"/><text x="44" y="262" class="v-t v-t--b">AI 找项目、按需读</text><text x="44" y="278" class="v-g">项目规则、专题、技能全文</text><rect class="v-fill-ai" x="262" y="248" width="406" height="32" rx="4"/><text x="274" y="268.5" class="v-t">“wly0829.cn 的 AGENTS.md：是什么、入口、不做什么”</text><circle class="v-a" cx="24" cy="310" r="5.5"/><text x="44" y="308" class="v-t v-t--b">派活前读模型清单</text><text x="44" y="324" class="v-g">各型号强在哪、弱在哪</text><rect class="v-fill-ai" x="262" y="294" width="406" height="32" rx="4"/><text x="274" y="314.5" class="v-t">“Sol：照定好的方案写代码划算；理解产品、定方案不交它”</text><circle class="v-a" cx="24" cy="344" r="6.5"/><text x="44" y="348.5" class="v-t v-t--b">动手干活</text><path class="v-sep" d="M44,364 L668,364"/><text x="44" y="386" class="v-g">开场读不到：各型号强在哪、弱在哪（派活前才读）、上次聊过什么（记忆关着）、别的对话、没打开的专题</text></svg>
