<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="1000" height="780" role="img" aria-labelledby="s04-password-title s04-password-desc">
  <title id="s04-password-title">主密码、高级别保险库与低级别密码中心</title>
  <desc id="s04-password-desc">主密码锁着绿匣和本地加密库。四把钥匙中的任一把都能打开密码中心。电脑密码中心与手机 App 自动同步，从电脑直接供给程序，AI 只收结果。最高权限的智能体凭加密凭据可以自行解开密码中心，解开后仍受规则约束。</desc>
  <defs>
    <g id="s04-key" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-3 -3a7 7 0 1 0 0 6h9v-3h4v-3z"/><circle cx="-9" cy="0" r="1.8"/>
    </g>
    <g id="s04-phone" class="v-l">
      <rect width="26" height="43" rx="4"/><path d="M9 5h8m-7 33h6"/>
    </g>
  </defs>

  <text x="32" y="69" class="s4-title">主密码</text>
  <circle cx="40" cy="92" r="4" class="v-w"/><text x="53" y="97" class="s4-sub">我们记住的</text>
  <g transform="translate(245 65) rotate(-30) scale(2)" class="s4-master-key"><use href="#s04-key"/></g>
  <text x="306" y="58" class="s4-heading">只在我们脑子里</text>
  <text x="306" y="86" class="s4-sub">哪里都不存，没有提示，也和别处的密码都不同。</text>
  <g class="v-l v-l--we">
    <path class="s4-unlock" pathLength="1" d="M242 92v53"/>
    <path class="s4-unlock" pathLength="1" d="M242 112h412q6 0 6 6v27"/>
  </g>
  <text x="32" y="182" class="s4-title">高级别</text>
  <text x="34" y="211" class="s4-sub">主密码锁着的</text><text x="34" y="232" class="s4-sub">两个保险库</text>
  <rect class="s4-card" x="195" y="145" width="367" height="102" rx="8"/>
  <use href="#s04-phone" x="212" y="166"/>
  <text x="253" y="178" class="s4-heading">绿匣</text><text x="317" y="177" class="s4-small">手机上</text>
  <text x="253" y="207" class="s4-sub">Google、微软账号密码和电脑开机密码</text>
  <text x="253" y="230" class="s4-small">随机长密码，我们自己也不知道。</text>
  <rect class="s4-card" x="576" y="145" width="390" height="102" rx="8"/>
  <g class="v-l" transform="translate(593 168)"><rect width="38" height="26" rx="3"/><path d="M16 26v7m6-7v7m-12 1h18"/></g>
  <text x="645" y="178" class="s4-heading">本地加密库</text><text x="782" y="177" class="s4-small">电脑上</text>
  <text x="645" y="207" class="s4-sub">保存同样的账号密码和电脑开机密码。</text>
  <text x="645" y="230" class="s4-small">恢复码只藏在电脑这边的加密文件里。</text>

  <g class="v-l s4-source-lines">
    <path d="M615 247v15q0 5-5 5H284v47"/><path d="M284 247v20"/>
    <path d="M647 247v29q0 5-5 5H500v33"/>
  </g>
  <circle class="v-p" cx="284" cy="267" r="2.5"/>
  <text x="34" y="336" class="s4-label">四把钥匙</text>
  <text x="34" y="361" class="s4-sub">任一把都能开</text>
  <rect class="s4-key-pair" x="599" y="283" width="367" height="106" rx="6"/>
  <text x="782" y="307" text-anchor="middle" class="s4-small">只在 Google 账号里，没有副本</text>
  <g text-anchor="middle">
    <g class="s4-key-row" style="--d: .65s">
      <use href="#s04-key" x="284" y="322"/><text x="284" y="352" class="s4-label">Google 或微软账号</text>
      <text x="284" y="375" class="s4-small">单开无痕窗口，重新登录</text><path class="v-l s4-key-wire" d="M284 385v24q0 6 6 6h118"/>
    </g>
    <g class="s4-key-row" style="--d: 1.35s">
      <use href="#s04-key" x="500" y="322"/><text x="500" y="352" class="s4-label">恢复码</text>
      <path class="v-l s4-key-wire" d="M500 365v44q0 6-6 6h-86"/>
    </g>
    <g class="s4-key-row" style="--d: 2.05s">
      <use href="#s04-key" x="690" y="326"/><text x="690" y="353" class="s4-label">通行密钥</text>
      <text x="690" y="376" class="s4-small">passkey</text><path class="v-l s4-key-wire" d="M690 390v19q0 6-6 6H408"/>
    </g>
    <g class="s4-key-row" style="--d: 2.75s">
      <use href="#s04-key" x="872" y="326"/><text x="872" y="353" class="s4-label">动态验证码</text>
      <text x="872" y="376" class="s4-small">TOTP</text><path class="v-l s4-key-wire" d="M872 390v19q0 6-6 6H408"/>
    </g>
  </g>
  <circle class="v-p" cx="408" cy="415" r="3"/><path class="v-l" d="M408 415v43"/>

  <text x="32" y="496" class="s4-title">低级别</text>
  <text x="34" y="525" class="s4-sub">日常要用的凭据</text>
  <rect class="s4-card" x="195" y="458" width="351" height="90" rx="8"/>
  <g class="v-l" transform="translate(212 475)">
    <rect width="42" height="40" rx="4"/><rect x="5" y="5" width="32" height="30" rx="2"/>
    <circle cx="21" cy="20" r="8"/><path d="M21 12v8l6 4m-6-4-6 4"/>
  </g>
  <text x="269" y="496" class="s4-heading">电脑上的密码中心</text>
  <text x="212" y="529" class="s4-sub">日常账号密码、BitLocker、API 密钥、银行卡</text>

  <path class="v-l" d="M233 551v56m-4-51 4-5 4 5m-8 46 4 5 4-5"/>
  <text x="253" y="573" class="s4-label">自动同步</text>
  <text x="253" y="597" class="s4-small">加密的库经私有 GitHub 中转</text>
  <rect class="s4-card" x="195" y="610" width="351" height="75" rx="8"/>
  <use href="#s04-phone" x="213" y="627"/>
  <text x="254" y="640" class="s4-label">手机上的密码中心 App</text>
  <text x="254" y="665" class="s4-small">手机上打开要验证，电脑随时能解绑手机。</text>

  <path id="s04-program-route" class="v-l" d="M546 505h50v-27q0-6 6-6h216"/>
  <path class="v-l v-l--ai" d="M596 505v79q0 6 6 6h216"/>
  <circle class="v-p" cx="596" cy="505" r="2.5"/>
  <circle class="v-p s4-delivery" r="4" style="offset-path: url(#s04-program-route)"/>
  <text x="615" y="460" class="s4-label">密码明文</text><text x="615" y="495" class="s4-small">按登记直接供给</text>
  <circle class="v-p" cx="818" cy="472" r="6"/><text x="834" y="478" class="s4-label">要用它的程序</text>
  <g class="s4-reply">
    <rect x="613" y="546" width="97" height="33" rx="7" class="v-fill-ai"/>
    <text x="661" y="569" text-anchor="middle" class="s4-label v-a">“办好了”</text>
  </g>
  <text x="615" y="614" class="s4-small">只回办理结果</text>
  <circle class="v-a" cx="818" cy="590" r="6"/><text x="834" y="596" class="s4-label v-a">AI</text>
  <text x="834" y="619" class="s4-small">看不到密码明文</text>

  <path class="v-sep" d="M32 704h934"/>
  <circle class="v-a" cx="42" cy="735" r="6"/><text x="59" y="741" class="s4-label">最高权限的智能体</text>
  <text x="280" y="736" class="s4-sub">凭一份加密凭据，不用我们验证，也能自己解开密码中心。</text>
  <text x="280" y="760" class="s4-small">解开后做什么，照样受规则约束。</text>
</svg>
