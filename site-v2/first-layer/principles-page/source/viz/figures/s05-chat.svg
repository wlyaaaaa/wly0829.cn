<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 584" width="680" height="584" role="img"><title>微信上的一轮，一套命令自己走完，我们不用碰</title><path class="v-l" style="stroke:var(--v-faint);stroke-width:1" d="M96,44 H664"/><path class="v-l" d="M96,104 L664,104"/><path class="v-l" d="M96,350 L664,350"/><path class="v-l v-l--ai" d="M340,246 L664,246"/><text x="28" y="48.5" class="v-t v-t--b">对方</text><text x="28" y="108.5" class="v-t v-t--b">程序</text><text x="28" y="250.5" class="v-t v-t--b">AI</text><text x="28" y="354.5" class="v-t v-t--b">我们</text><path class="v-l" d="M340,104 L340,246"/><path class="v-l" d="M440,104 L440,118"/><path class="v-l" d="M440,232 L440,246"/><path class="v-l" d="M520,246 L520,44"/><path class="v-l" d="M566,104 L566,44"/><path class="v-l" d="M640,104 L640,44"/><path class="v-l" d="M268,54 v8 M268,58 H340 M340,54 v8"/><path class="v-l" d="M340,308 v8 M340,312 H520 M520,308 v8"/><rect class="v-box" x="374" y="118" width="132" height="114" rx="6"/><text x="387" y="132.5" class="v-t">语音用微信转写</text><path class="v-sep" d="M375,138 H505"/><text x="387" y="152.5" class="v-t">动图拼帧约 3 秒</text><path class="v-sep" d="M375,158 H505"/><text x="387" y="172.5" class="v-t">图片</text><path class="v-sep" d="M375,178 H505"/><text x="387" y="192.5" class="v-t">相关的上下文</text><path class="v-sep" d="M375,198 H505"/><text class="v-g" text-anchor="start"><tspan x="387" y="212">每条带着谁说的、</tspan><tspan x="387" y="225">几点说的</tspan></text><circle cx="196" cy="44" r="4.5" style="fill:var(--v-faint)"/><circle cx="226" cy="44" r="4.5" style="fill:var(--v-faint)"/><circle cx="256" cy="44" r="4.5" style="fill:var(--v-faint)"/><circle class="v-p" cx="340" cy="104" r="6"/><circle class="v-p" cx="440" cy="104" r="6"/><circle class="v-p" cx="520" cy="104" r="6"/><circle class="v-p" cx="566" cy="104" r="6"/><circle class="v-p" cx="640" cy="104" r="6"/><circle cx="140" cy="246" r="5.25" style="fill:#fff;stroke:var(--v-ai);stroke-width:1.5"/><circle class="v-a" cx="440" cy="246" r="6"/><text x="196" y="32" class="v-t" text-anchor="middle">语音</text><text x="226" y="32" class="v-t" text-anchor="middle">动图</text><text x="256" y="32" class="v-t" text-anchor="middle">图片</text><text x="580" y="32" class="v-g" text-anchor="middle">发的可以是文字、emoji、表情包</text><text x="304" y="74" class="v-g" text-anchor="middle">停下 15 秒</text><text x="140" y="78" class="v-t" text-anchor="middle">等消息的命令</text><text x="140" y="93" class="v-g" text-anchor="middle">挂在后台</text><text x="340" y="94" class="v-t" text-anchor="middle">叫起 AI</text><text x="440" y="94" class="v-t" text-anchor="middle">一条命令取回这一轮</text><text class="v-g" text-anchor="start"><tspan x="530" y="122">第一条马上发</tspan><tspan x="530" y="136">后面按打字的时间</tspan><tspan x="530" y="150">再加随机停顿</tspan><tspan x="530" y="164">发之前核对有没有新消息</tspan></text><text x="28" y="124" class="v-g">只靠命令，不点窗口</text><text class="v-g" text-anchor="middle"><tspan x="140" y="268">可以在做别的活</tspan><tspan x="140" y="282">也可以不在思考</tspan></text><text class="v-t" text-anchor="middle"><tspan x="440" y="268">看懂这一轮</tspan><tspan x="440" y="282">判断什么时候回</tspan><tspan x="440" y="296">拟好回复</tspan></text><text x="430" y="328" class="v-t" text-anchor="middle">命令不超过 10 秒，连想一般不超过 60 秒</text><path class="v-l" style="stroke:var(--v-faint);stroke-width:1" d="M96,410 H664"/><path class="v-l" d="M96,446 L664,446"/><path class="v-l" d="M96,548 L664,548"/><path class="v-l v-l--ai" d="M96,490 L280,490"/><text x="28" y="414.5" class="v-t v-t--b">对方</text><text x="28" y="450.5" class="v-t v-t--b">程序</text><text x="28" y="494.5" class="v-t v-t--b">AI</text><text x="28" y="552.5" class="v-t v-t--b">我们</text><path class="v-l" d="M170,410 L170,490"/><path class="v-l" d="M280,548 L280,490"/><circle cx="170" cy="410" r="4.5" style="fill:#fff;stroke:var(--v-faint);stroke-width:1.25"/><circle class="v-p" cx="170" cy="446" r="6"/><circle class="v-p" cx="370" cy="446" r="6"/><circle cx="170" cy="490" r="5.25" style="fill:#fff;stroke:var(--v-ai);stroke-width:1.5"/><circle class="v-w0" cx="280" cy="548" r="5.25"/><text x="170" y="398" class="v-t" text-anchor="middle">对方又发</text><text x="370" y="436" class="v-t" text-anchor="middle">接着挂在后台</text><text class="v-t" text-anchor="middle"><tspan x="170" y="512">没发的旧稿停掉</tspan><tspan x="170" y="526">立刻重拟再发</tspan></text><text x="292" y="494.5" class="v-t">收声</text><text x="280" y="569" class="v-t" text-anchor="middle">我们一接话</text></svg>
