<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 272" width="680" height="272" role="img"><title>事情在后台标签页里办完，我们只开口和看结果；上传到百分之百不算收到，平台的办理记录里有才算</title><path class="v-l" d="M128,58 L640,58"/><path class="v-l" d="M128,150 L595,150"/><path class="v-l" d="M150,200 L340,200"/><path class="v-l" d="M340,240 L340,150"/><path class="v-l" d="M595,150 L595,184"/><path class="v-l" d="M595,174 L436,174 Q429,174 429,181 L429,184"/><path class="v-l" d="M640,184 L640,58"/><rect class="v-box" x="358" y="184" width="142" height="44" rx="6" style="stroke:var(--v-faint)"/><text x="370" y="198" class="v-g">上传窗口</text><path class="v-sep" d="M359,204 H499"/><text x="370" y="220" class="v-g">说明.pdf</text><rect x="419" y="214" width="35" height="4" rx="2" style="fill:var(--v-muted)"/><text x="488" y="220" class="v-n" text-anchor="end">100%</text><text x="429" y="245" class="v-g" text-anchor="middle">不算收到</text><rect class="v-box" x="511" y="184" width="153" height="44" rx="6"/><text x="523" y="198" class="v-g">办理记录</text><path class="v-sep" d="M512,204 H663"/><text x="523" y="220.5" class="v-t">已接收 · 附件 说明.pdf</text><text x="587.5" y="245.5" class="v-t" text-anchor="middle">这才算收到</text><text x="632" y="100" class="v-g" text-anchor="end">按办理记录交回结果</text><circle class="v-p" cx="150" cy="200" r="6"/><circle class="v-p" cx="250" cy="200" r="6"/><circle class="v-p" cx="340" cy="200" r="6"/><text x="150" y="221" class="v-g" text-anchor="middle">手机收到短信</text><text class="v-g" text-anchor="middle"><tspan x="250" y="221">电脑经手机桥</tspan><tspan x="250" y="235">认出验证码</tspan></text><text x="333" y="190" class="v-g" text-anchor="end">哪边先到用哪边</text><text x="340" y="257" class="v-g" text-anchor="middle">Gmail 并进来</text><circle class="v-a" cx="170" cy="150" r="6"/><text x="170" y="137" class="v-t" text-anchor="middle">认出账号</text><circle class="v-a" cx="255" cy="150" r="6"/><text class="v-t" text-anchor="middle"><tspan x="255" y="123">填手机号</tspan><tspan x="255" y="137">或邮箱</tspan></text><circle class="v-a" cx="340" cy="150" r="6"/><text x="340" y="137" class="v-t" text-anchor="middle">登录</text><circle class="v-a" cx="425" cy="150" r="6"/><text x="425" y="137" class="v-t" text-anchor="middle">同意用户协议</text><circle class="v-a" cx="510" cy="150" r="6"/><text x="510" y="137" class="v-t" text-anchor="middle">填表传附件</text><circle class="v-a" cx="595" cy="150" r="6"/><text x="595" y="137" class="v-t" text-anchor="middle">回平台查记录</text><text class="v-g" text-anchor="middle"><tspan x="425" y="96">长期授权过</tspan><tspan x="425" y="110">不再来问</tspan></text><circle class="v-w" cx="128" cy="58" r="6"/><circle class="v-w" cx="640" cy="58" r="6"/><circle class="v-w0" cx="340" cy="58" r="5.25"/><text x="128" y="45" class="v-t" text-anchor="middle">开口</text><text x="340" y="45" class="v-t" text-anchor="middle">真要亲手登录</text><text x="640" y="45" class="v-t" text-anchor="middle">看结果</text><text x="28" y="62.5" class="v-t v-t--b">我们</text><text x="28" y="154.5" class="v-t v-t--b">后台标签页</text><text x="28" y="171" class="v-g">不抢窗口和标签页</text></svg>
