<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 266" width="680" height="266" role="img"><title>估时：AI 拆步，程序照以往的实际用时算，按长短分档，交付后实际多久折回记录</title><path class="v-l" d="M40,48 L593,48 Q600,48 600,55 L600,104"/><path class="v-l" d="M170,48 L170,104"/><path class="v-l" d="M80,104 L600,104"/><path class="v-l" d="M205,104 L205,179 Q205,186 212,186 L652,186"/><path class="v-l" d="M475,160 v-4 H588 v4"/><path class="v-l" d="M531.5,156 L531.5,104"/><path class="v-l" d="M588,99 L588,109"/><circle class="v-a" cx="80" cy="104" r="6"/><circle class="v-p" cx="170" cy="104" r="6"/><circle class="v-w0" cx="531.5" cy="104" r="5.25"/><text class="v-t" text-anchor="middle"><tspan x="531.5" y="80">我们回了、没有否定</tspan><tspan x="531.5" y="94">才开工</tspan></text><text x="245" y="174" class="v-t" text-anchor="middle">20 分钟内</text><path class="v-l" d="M245,182 L245,190"/><text class="v-g" text-anchor="middle"><tspan x="245" y="208">小事</tspan><tspan x="245" y="222">不用报预计时间</tspan><tspan x="245" y="236">直接开工</tspan></text><text x="360" y="174" class="v-t" text-anchor="middle">70 分钟以上</text><circle cx="360" cy="186" r="5.25" style="fill:#fff;stroke:var(--v-ai);stroke-width:1.5"/><text class="v-g" text-anchor="middle"><tspan x="360" y="208">AI 说值不值</tspan><tspan x="360" y="222">不值，就提醒我们</tspan><tspan x="360" y="236">没必要做</tspan></text><text x="475" y="174" class="v-t" text-anchor="middle">100 分钟以上</text><circle cx="475" cy="186" r="5.25" style="fill:#fff;stroke:var(--v-ai);stroke-width:1.5"/><text class="v-g" text-anchor="middle"><tspan x="475" y="208">先和我们说</tspan><tspan x="475" y="222">核心思路</tspan></text><text x="588" y="174" class="v-t" text-anchor="middle">6 小时以上</text><circle cx="588" cy="186" r="5.25" style="fill:#fff;stroke:var(--v-ai);stroke-width:1.5"/><text class="v-g" text-anchor="middle"><tspan x="588" y="208">先做可行性论证</tspan><tspan x="588" y="222">凭什么走得通，看到什么就停</tspan><tspan x="588" y="236">只开一页汇报页</tspan><tspan x="588" y="250">实时更新，带时间进度</tspan></text><text x="40" y="37" class="v-t">以往实际用了多久</text><text x="612" y="80.5" class="v-t">实际多久</text><text x="80" y="128" class="v-t" text-anchor="middle">拆成几步</text><text x="170" y="128" class="v-t" text-anchor="middle">估时程序</text><text x="588" y="128" class="v-t" text-anchor="middle">交付</text><text x="217" y="130" class="v-g">报程序算出的数</text></svg>
