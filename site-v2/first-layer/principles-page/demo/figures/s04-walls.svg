<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 504" width="1000" height="504" role="img" aria-labelledby="s04-walls-title s04-walls-desc">
  <title id="s04-walls-title">挡在哪一层</title>
  <desc id="s04-walls-desc">六种情况下，小点都停在第一道墙前。实心绿墙表示这条路上一定会遇到的防护，空心旁注表示有条件才发生的事。最右侧是受保护的数据。</desc>
  <defs>
    <g id="s04-first-wall">
      <rect class="v-w" x="305" y="-20" width="8" height="40" rx="4"/>
      <rect class="s4-card" x="323" y="-20" width="209" height="40" rx="6"/>
    </g>
  </defs>
  <text x="34" y="53" class="s4-heading">挡在哪一层</text>
  <rect class="v-w" x="645" y="34" width="6" height="19" rx="3"/>
  <text x="662" y="49" class="s4-sub">必经的墙</text>
  <circle class="v-w0" cx="790" cy="44" r="5"/>
  <text x="803" y="49" class="s4-sub">有条件才发生</text>
  <path class="v-sep" d="M34 73h932"/>
  <text x="34" y="102" class="s4-small">遇到的情况</text>
  <text x="305" y="102" class="s4-small">第一道墙</text>
  <text x="581" y="102" class="s4-small">后面还有什么</text>

  <g transform="translate(0 144)" style="--d: 0.00s">
    <text x="34" y="6" class="s4-scenario">手机丢了</text>
    <path class="v-l" d="M224 0h69"/><circle class="v-p s4-traveler" cx="293" cy="0" r="5.2"/>
    <use href="#s04-first-wall"/><text x="336" y="6" class="s4-cell">重启要密码 · SIM 卡 PIN</text>
    <path class="v-l s4-aside-line" d="M542 0h44"/><circle class="v-w0" cx="592" cy="0" r="5"/>
    <text class="s4-sub"><tspan x="610" y="-4">我们下令后，一联网</tspan><tspan x="610" y="17">就远程抹掉</tspan></text>
  </g>

  <g transform="translate(0 206)" style="--d: 0.23s">
    <text x="34" y="6" class="s4-scenario">电脑关着被拿走</text>
    <path class="v-l" d="M224 0h69"/><circle class="v-p s4-traveler" cx="293" cy="0" r="5.2"/>
    <use href="#s04-first-wall"/><text x="336" y="6" class="s4-cell">整盘 BitLocker</text>
    <path class="v-l" d="M542 0h36"/><rect class="v-w" x="586" y="-20" width="8" height="40" rx="4"/>
    <rect class="s4-card" x="604" y="-20" width="205" height="40" rx="6"/>
    <text x="615" y="6" class="s4-cell">开机密码谁也不知道</text>
  </g>

  <g transform="translate(0 268)" style="--d: 0.46s">
    <text x="34" y="6" class="s4-scenario">电脑开着，被人坐上去</text>
    <path class="v-l" d="M224 0h69"/><circle class="v-p s4-traveler" cx="293" cy="0" r="5.2"/>
    <use href="#s04-first-wall"/><text x="336" y="6" class="s4-cell">资料没解锁就还锁着</text>
    <path class="v-l s4-aside-line" d="M542 0h44"/><circle class="v-w0" cx="592" cy="0" r="5"/>
    <text class="s4-sub"><tspan x="610" y="-4">一重启，资料解锁</tspan><tspan x="610" y="17">和授权全到期</tspan></text>
  </g>

  <g transform="translate(0 330)" style="--d: 0.69s">
    <text class="s4-scenario"><tspan x="34" y="-4">拿手机号、邮箱找回</tspan><tspan x="34" y="17">Google、微软账号</tspan></text>
    <path class="v-l" d="M224 0h69"/><circle class="v-p s4-traveler" cx="293" cy="0" r="5.2"/>
    <use href="#s04-first-wall"/><text x="336" y="6" class="s4-cell">没绑手机号和邮箱</text>
    <path class="v-l" d="M542 0h36"/><rect class="v-w" x="586" y="-20" width="8" height="40" rx="4"/>
    <rect class="s4-card" x="604" y="-20" width="205" height="40" rx="6"/>
    <text x="615" y="6" class="s4-cell">要账号密码加第二道验证</text>
  </g>

  <g transform="translate(0 392)" style="--d: 0.92s">
    <text x="34" y="6" class="s4-scenario">探测公网入口</text>
    <path class="v-l" d="M224 0h69"/><circle class="v-p s4-traveler" cx="293" cy="0" r="5.2"/>
    <use href="#s04-first-wall"/><text x="336" y="6" class="s4-cell">通到电脑的入口都要凭证</text>
    <path class="v-l s4-aside-line" d="M542 0h44"/><circle class="v-w0" cx="592" cy="0" r="5"/>
    <text class="s4-sub"><tspan x="610" y="-4">出事在手机上一键锁电脑、</tspan><tspan x="610" y="17">收回授权</tspan></text>
  </g>

  <g transform="translate(0 454)" style="--d: 1.15s">
    <text x="34" y="6" class="s4-scenario">U 盘丢了</text>
    <path class="v-l" d="M224 0h69"/><circle class="v-p s4-traveler" cx="293" cy="0" r="5.2"/>
    <use href="#s04-first-wall"/><text x="336" y="6" class="s4-cell">BitLocker</text>
  </g>

  <rect class="s4-data-box" x="841" y="119" width="125" height="362" rx="10"/>
  <g transform="translate(903 282)" class="v-l v-l--we">
    <rect x="-14" y="-6" width="28" height="22" rx="3"/><path d="M-8-6v-7a8 8 0 0 1 16 0v7m-8 8v6"/>
  </g>
  <text x="903" y="328" text-anchor="middle" class="s4-label">我们的数据</text>
</svg>
