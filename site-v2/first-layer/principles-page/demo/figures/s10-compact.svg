<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" width="680" height="290" role="img"><title>为什么到 500K 压缩：不压缩时每一轮要重读的长度一路往上，总消耗是底下整块三角；到 500K 压成摘要再接着聊，只剩几块小三角</title><style>.s10c-saw{fill:rgb(20 20 19 / .1)}.s10c-flat{stroke:var(--v-faint)}.s10c-cover{transform-box:fill-box;transform-origin:100% 50%;transform:scaleX(0)}.s10c-ready .s10c-cover{transform:scaleX(1)}.s10c-play .s10c-cover{animation:s10c-uncover 2.4s linear both}.s10c-paper{fill:var(--paper,#faf9f5)}.s10c-tint{fill:var(--tint,rgb(20 20 19 / .042))}@keyframes s10c-uncover{from{transform:scaleX(1)}to{transform:scaleX(0)}}</style><g class="s10c-plot"><path class="v-l" style="stroke:var(--v-faint);stroke-width:1" d="M78,182 L652,182"/><path class="v-fill-p" d="M78,256 L652,46 L652,256 Z"/><path class="s10c-saw" d="M78,256 L280.3,182 L280.3,243 L447,182 L447,243 L613.7,182 L613.7,243 L652,229 L652,256 Z"/><path class="v-l s10c-flat" d="M78,256 L652,46"/><path class="v-l" d="M78,256 L280.3,182 L280.3,243 L447,182 L447,243 L613.7,182 L613.7,243 L652,229"/><circle class="v-o" cx="280.3" cy="182" r="5.4"/><circle class="v-o" cx="447" cy="182" r="5.4"/><circle class="v-o" cx="613.7" cy="182" r="5.4"/><text x="540" y="72" class="v-t v-t--b" text-anchor="end">不压缩</text><text x="646" y="114" class="v-g" text-anchor="end">底下这一整块就是总消耗</text><text x="646" y="129" class="v-g" text-anchor="end">大致按长度的平方增长</text><text x="398" y="166" class="v-t">到 500K 自动压缩：只剩底下这几块小三角</text><path class="v-l" style="stroke:var(--v-faint);stroke-width:1" d="M222.3,148 L274.3,177"/><text x="218.3" y="128" class="v-t" text-anchor="end">压成摘要，</text><text x="218.3" y="144" class="v-t" text-anchor="end">靠《他要什么》接上</text></g><g class="s10c-cover"><rect class="s10c-paper" x="79" y="0" width="601" height="255.5"/><rect class="s10c-tint" x="79" y="0" width="601" height="255.5"/></g><path class="v-l" d="M78,26 L78,256 L660,256"/><text x="70" y="186.5" class="v-t v-t--b" text-anchor="end">500K</text><text x="88" y="30" class="v-t">这一轮要重读多长</text><text x="660" y="278" class="v-t" text-anchor="end">对话一轮轮往下聊</text></svg>
