<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1440"><title>计划任务 · 实况</title>
<link rel="stylesheet" href="/header/topbar.css"><link rel="stylesheet" href="/connect-auth/glass.css"><link rel="stylesheet" href="/trust-modal/trust-modal.css">
<link rel="stylesheet" href="/live/_lib/live.css"><link rel="stylesheet" href="/live/_lib/live-page.css"><link rel="stylesheet" href="/live/_lib/live-board.css"><link rel="stylesheet" href="/motion/motion.css"><script src="/motion/motion.js"></script>
<style>
.page--tasks .stage { padding-bottom: 42px; }
.page--tasks .lb-card[data-art="generic"] { --lb-art: url("/live/img/tasks.webp"); }
/* 每组卡头的插画（画风变量：对清以后换图只改这里） */
.page--tasks .lb-card[data-art="ai"] { --lb-art: url("/live/img/tasks-grp-ai.webp"); }
.page--tasks .lb-card[data-art="upkeep"] { --lb-art: url("/live/img/tasks-grp-upkeep.webp"); }
.page--tasks .lb-card[data-key="upkeep"] .lb-card__title { color: #00A650; }
.page--tasks .lb-card[data-art="hardware"] { --lb-art: url("/live/img/tasks-grp-hardware.webp"); }
.page--tasks .lb-card[data-art="backup"] { --lb-art: url("/live/img/tasks-grp-backup.webp"); }
.page--tasks .lb-card[data-art="daily"] { --lb-art: url("/live/img/tasks-grp-daily.webp"); }
.page--tasks .lb-card[data-art="remote"] { --lb-art: url("/live/img/tasks-grp-remote.webp"); }
.page--tasks .lb-card[data-art="online"] { --lb-art: url("/live/img/tasks-grp-online.webp"); }
.page--tasks .lb-card[data-art="vendor"] { --lb-art: url("/live/img/tasks-grp-vendor.webp"); }
.page--tasks .lb-card[data-art="ai-schedule"] { --lb-art: url("/live/img/tasks-grp-ai-schedule.webp"); }
.page--tasks .lb-card[data-art="idle"] { --lb-art: url("/live/img/tasks-grp-idle.webp"); }
.page--tasks .hero__note { display:block; letter-spacing:0; word-spacing:normal; }
/* 维护明细（?scope=ai-today）的标题长：标题和说明在左边自己那一栏里折行，不伸到中间读数卡底下 */
.tasks--ai-today .lbp-title > div { min-width: 0; }
.tasks--ai-today .lbp-title h1 { white-space: normal; word-break: keep-all; }
@media (min-width: 1280px) { .tasks--ai-today .lbp-title h1 { font-size: 26px; line-height: 34px; } }
.page--tasks #project-filter { gap: 4px; padding: 0 4px 0 12px; height: 34px; border-radius: 12px; background: rgb(255 255 255 / .5); box-shadow: inset 0 0 0 1px rgb(20 20 19 / .06); font-size: 13.5px; color: var(--ink-soft); }
.page--tasks #project-filter .more { margin: 0; translate: 0 0; }
.page--tasks #project-label a { color: inherit; text-decoration: none; }
.page--tasks #project-label a:hover { color: #00813f; }
.page--tasks #changes .row__main { font-size: 14px; line-height: 21px; }
.page--tasks #changes .row__meta { margin-left: 6px; font-size: 12.5px; }
.page--tasks #changes .row--flat { padding: 7px 0 8px; grid-template-columns: 0 minmax(0, 1fr) auto; }
#task-side { align-self: stretch; }
/* 右边一栏展开“再看”“变化”时在栏里滚动，不把左边标题、中间大卡和下面的搜索往下推 */
#task-side { contain: size; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
/* 首屏统计格按字的长短排，标签不折成两行 */
.page--tasks .lbp-stats { display: flex; flex-wrap: wrap; }
.page--tasks .lbp-stat { flex: 1 1 auto; }
.page--tasks .lbp-stat small { white-space: nowrap; overflow-wrap: normal; }
#task-side > details > summary { font-size: 14px; cursor: pointer; color: var(--muted); }
#upcoming { margin-bottom: 8px; }
#upcoming > .part { margin: 0 0 6px; }
#upcoming .row { grid-template-columns: 100px minmax(0, 1fr); min-height: 0; padding: 4px 0; font-size: 13px; line-height: 18px; }
#upcoming .row__meta { margin: 0; white-space: nowrap; font-variant-numeric: tabular-nums; }
#upcoming summary { margin-top: 6px; font-size: 13px; }
.page--tasks .lb-card__sub { display: block; overflow: visible; text-wrap: pretty; }
.page--tasks .lb-card__sub:empty { display: none; }
.page--tasks .lb-card[data-key="unregistered"] .lb-card__sub { overflow-wrap: anywhere; }
.page--tasks .lb-card__head { min-height: 98px; padding-right: calc(34% + 14px); }
.page--tasks .lb-card__words { padding-right: 0; }
.page--tasks .lb-card[data-art="daily"] .lb-card__head { padding-right: calc(32% + 10px); }
.page--tasks #groups .lb { grid-auto-rows: auto; grid-auto-flow: row; row-gap: var(--lb-gap); }
.page--tasks #groups .lb > .lb-card { align-self: stretch; grid-row-end: auto !important; }
/* 有一张卡展开时，同一排别的卡不跟着拉长 */
.page--tasks #groups .lb:has(.lb-card__more[aria-expanded="true"]) > .lb-card { align-self: start; }
.page--tasks #groups .lb:not(.is-single) > .lb-card:not(.task-full) { grid-column: auto !important; }
.page--tasks .task-full { grid-column: 1 / -1 !important; }
/* 电脑窗口窄（如 1024 宽）三栏摆不下任务名：分组卡改两栏（M492） */
@media (width > 1279px) {
  .page--tasks #groups .lb.task-pair:not(.is-single) > [data-key="vendor"]:nth-child(3n of .lb-card:not([hidden])) { grid-column: 1 !important; }
}
@media (max-width: 1279px) {
  .page--tasks #groups .lb:not(.is-single) { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .page--tasks #groups .lb.task-pair:not(.is-single) > [data-key="vendor"]:nth-child(2n of .lb-card:not([hidden])) { grid-column: 1 !important; }
}
.page--tasks .task-compact { min-height: 46px; padding-block: 5px; }
.task-compact .lb-cell--name p { margin: 0; }
.task-compact .lb-cell--name { overflow-wrap: normal; }
.task-compact .lb-cell--name > p:first-child { text-wrap: pretty; }
.task-compact .task-purpose { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* 任务名下面那行用途整句显示，放不下就换行，不截成“…”（M760） */
.page--tasks .task-compact .task-purpose { white-space: normal; overflow: visible; text-overflow: clip; text-wrap: pretty; }
.task-compact .lb-cell--time > * { overflow: visible; }
.task-compact .task-last > span { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; }
.page--tasks .lb-card[data-key="disabled"] .task-last > [data-task-state] { white-space: normal; }
.task-compact .task-last:has(.task-week) { line-height: 14px; }
.task-compact .task-last .task-week { margin-top: 0; }
.task-compact .task-last .task-days { gap: 2px; }
.task-compact .task-days :is(.task-day,.rec-none) { box-sizing: border-box; width: 10px; height: 10px; flex: 0 0 10px; border-radius: 3px; }
.task-compact .task-days .rec-none { background: #dedcd5; font-size: 0; }
.task-state-dot { display: inline-block; box-sizing: border-box; flex: none; width: 8px; height: 8px; border-radius: 50%; background: #aaa9a4; }
.task-state-dot[data-state="ok"] { background: #00a650; }
/* 结果颜色和近 7 天小方块、详情页、备份页同一套：成功绿、有出错但大部分成功（和部分完成）黄、部分成功橙、出错红（M779、M806） */
.task-state-dot[data-state="failed"] { background: #d9443a; }
.task-state-dot[data-state="running"] { background: #5e83a9; }
.task-state-dot[data-state="warn"] { background: #e9b714; }
.task-compact .task-why { margin: 1px 0 0; color: #9a6514; font-size: 12px; line-height: 16px; }
/* AI 已接手在修：和页头灯的蓝一个色（M159） */
.task-state-dot[data-state="fixing"] { background: #7186df; box-shadow: 0 0 0 3px rgb(113 134 223 / .22); }
.task-compact .task-fixing { margin: 1px 0 0; color: #5266ba; font-size: 12px; line-height: 16px; font-weight: 600; }
.task-state-dot[data-state="unknown"] { background: transparent; border: 1px solid #aaa9a4; }
.page--tasks #next:not([hidden]) { display: flex; margin: 18px auto 0; translate: 0 0; }
/* 近 7 天的小方块：放在“上次运行”那一格的第二行 */
.task-week { margin-top: 9px; }
.task-days { display: flex; gap: 6px; width: max-content; }
.task-day { position: relative; width: 15px; height: 15px; padding: 0; border: 1px solid #d9ddd7; border-radius: 4px; background: #f0f1ed; cursor: pointer; }
.task-day[data-state="ok"] { background: rgb(var(--glow-green)); border-color: transparent; }
.task-day[data-state="observed-ok"] { background: transparent; border-color: rgb(var(--glow-green)); }
.task-day[data-state="failed"] { background: #d9443a; border-color: #d9443a; }
.task-day[data-state="partial"] { background: #ef7a22; border-color: #ef7a22; }
.task-day:is([data-state="mostly"],[data-state="warn"],[data-state="observed-failed"]) { background: #e9b714; border-color: #e9b714; }
.task-day[data-state="unknown"] { background: repeating-linear-gradient(135deg, #ddd 0 1px, transparent 1px 4px); border-style: dashed; }
.live-offline .task-day { background: transparent; border-color: #aeb9b3; box-shadow: none; }
.task-day-tip { display: none; position: absolute; z-index: 6; bottom: 23px; left: -8px; width: max-content; padding: 7px 10px; border-radius: 8px; background: #f6faf9; box-shadow: 0 5px 24px #153d3426; color: #263c37; font-size: 13px; white-space: nowrap; }
.task-day:is(:hover,:focus) .task-day-tip { display: block; }
.task-day:focus-visible { outline: 2px solid #263c37; outline-offset: 3px; }
/* 小方块能点：手形、指上去放大，点了描深色框并弹出那天的结果（强调绿边框只给用途未登记的任务，M779） */
.task-compact .task-days .task-day { cursor: pointer; transition: transform .15s; }
.task-compact .task-days .task-day:hover { transform: scale(1.3); }
.task-compact .task-days .task-day:focus { outline: 2px solid #263c37; outline-offset: 2px; }
/* 弹出的那天结果放在小方块下面，不盖住上面的上次运行时间 */
.task-compact .task-day-tip { bottom: auto; top: 15px; }
.lb-run .task-week { margin: 0; }
.lb-run .task-days { gap: 2px; }
.lb-run .task-day, .lb-run .task-days .rec-none { display: inline-block; box-sizing: border-box; width: 7px; height: 7px; border-radius: 2px; }
.lb-run .task-days .rec-none { border: 0; background: #dedcd5; font-size: 0; line-height: 0; overflow: hidden; vertical-align: top; }
.lb-run .task-day-tip { bottom: 14px; left: -6px; font-size: 12.5px; }
/* 强调绿边框只给“用途未登记”那一组（本人 11-24：“用途未登记计划任务才改成强调绿边框”，M779）；
   从别处点进来要看的那几行（?attention=1 要处理的、?item=、?source=）照旧淡入、滚到眼前，停稳后留一圈和点小方块同色的深色框、淡灰底，不用全站通用的绿框 */
.page--tasks .lb-card[data-key="unregistered"] { outline: 2px solid #00a650; outline-offset: -2px; }
body.page--tasks .lb-row.notice-target { outline: 2px solid rgb(38 60 55 / .6); outline-offset: 3px; background-image: linear-gradient(rgb(38 60 55 / .06), rgb(38 60 55 / .06)); }
</style></head>
<body class="page page--live page--l2 page--board page--tasks"><header class="topbar" id="topbar" data-state="full" data-hidden="false" data-style="float"></header>
<main class="stage"><div class="field" aria-hidden="true"></div><a class="back" href="/live/#tasks" data-back data-mo-rise>实况</a><ul class="notices" id="notices" aria-live="polite"></ul>
<div class="lbp-top">
<div class="lbp-title" data-mo-rise><img src="/live/img/tasks-icon.webp" width="360" height="360" alt="" aria-hidden="true"><div><h1>计划任务</h1><p id="task-intro">Windows 任务计划程序登记的任务，按用途分组。</p><p class="lbp-asof" id="asof" hidden></p></div></div>
<article class="card card--hero" id="hero" data-pic="right" data-mo-rise><div class="card__glow" aria-hidden="true"></div><img class="card__tint" src="/live/img/tasks.webp" alt="" aria-hidden="true">
<div class="card__glass glass"><span class="card__pic" aria-hidden="true"><img src="/live/img/tasks.webp" width="1000" height="1000" alt=""></span><div class="card__body">
<p class="card__head" id="head"><span class="lamp" aria-hidden="true"></span><span class="head__lead">正在读</span></p><p class="hero__note" id="note">正在读</p><div class="lbp-stats" id="stats"></div></div></div></article>
<section class="lbp-side glass l2-col" id="task-side" data-mo-rise>
<section id="upcoming" hidden><p class="part">接下来 24 小时</p><ul class="rows list"></ul><details><summary class="live-disclosure"></summary><ul class="rows list"></ul></details></section>
<details id="changes-box"><summary id="changes-title" data-keep>任务变化</summary><ul class="rows list" id="changes"><li class="row row--flat row--empty" data-key="wait"><span></span><p class="row__sub">正在读</p></li></ul></details>
<p class="part" id="coverage-label" hidden>读到了哪些</p><p class="pj-note" id="coverage" hidden>正在读</p><ul class="rows list" id="sources" hidden></ul></section>
</div>
<div class="lbp-tools" data-mo-rise>
<form class="l2-search lbp-search" role="search" id="search"><input id="q" name="q" type="search" aria-label="搜索任务名字" placeholder="搜索任务名字" autocomplete="off"><button data-needs-pc type="submit" class="pill-btn">查找</button></form>
<label class="l2-filter"><select id="project-pick" aria-label="按项目看"><option value="">全部项目</option></select></label>
<label class="l2-filter"><select id="group-pick" aria-label="按分组看"><option value="">全部分组</option></select></label>
<div class="l2-nav" id="project-filter" hidden><span id="project-label"></span><a class="more more--link" id="project-clear">清除项目筛选 ×</a></div>
<div class="lbp-tools__end hero__links"><a class="more" id="other-tasks" href="/live/automation/">自动任务 ›</a></div>
</div>
<div id="groups"><p class="part" hidden data-keep>按用途</p><ul class="rows list" id="task-empty"><li class="row row--flat row--empty" data-key="wait"><span></span><p class="row__sub">正在读</p></li></ul></div>
<button class="more" type="button" id="next" hidden data-needs-pc>还有更多 ›</button></main>
<script src="/trust-modal/trust-modal.js"></script><script src="/live/_lib/live-view-switch.js"></script><script src="/live/_lib/live-client.js"></script><script src="/live/_lib/live-ui.js"></script><script src="/header/topbar.js"></script><script src="/live/_lib/live-light.js"></script><script src="/live/_lib/live-board.js"></script><script src="/live/tasks/page.js"></script></body></html>
