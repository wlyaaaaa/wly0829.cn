<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>笔记本 · 实况</title>
<link rel="stylesheet" href="/header/topbar.css">
<link rel="stylesheet" href="/connect-auth/glass.css">
<link rel="stylesheet" href="/trust-modal/trust-modal.css">
<link rel="stylesheet" href="/live/_lib/live.css">
<link rel="stylesheet" href="/live/_lib/live-page.css">
<link rel="stylesheet" href="/motion/motion.css">
<link rel="stylesheet" href="/live/laptop/page.css">
<script src="/motion/motion.js"></script>
</head>
<body class="page page--live page--l2 page--data page--laptop">
<svg class="laptop-symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <symbol id="li-laptop" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="12" rx="2"/><path d="m4 16-2 4h20l-2-4M9 20h6"/></symbol>
  <symbol id="li-battery" viewBox="0 0 24 24"><rect x="2" y="7" width="17" height="10" rx="2"/><path d="M22 10v4M6 10v4m3-4v4m3-4v4"/></symbol>
  <symbol id="li-cpu" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M9 3v3m6-3v3m-6 12v3m6-3v3M3 9h3m-3 6h3m12-6h3m-3 6h3"/></symbol>
  <symbol id="li-memory" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="10" rx="2"/><path d="M6 10v2m4-2v2m4-2v2m4-2v2M6 16v3m4-3v3m4-3v3m4-3v3"/></symbol>
  <symbol id="li-disk" viewBox="0 0 24 24"><path d="M3 15l3-9h12l3 9m-5 2h2"/><rect x="3" y="13" width="18" height="6" rx="2"/></symbol>
  <symbol id="li-network" viewBox="0 0 24 24"><path d="M2 8a16 16 0 0 1 20 0M5 12a11 11 0 0 1 14 0m-11 4a6 6 0 0 1 8 0m-4 4h.01"/></symbol>
  <symbol id="li-remote" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="13" rx="2"/><path d="M8 21h8m-4-5v5m-3-11h6m-2-2 2 2-2 2"/></symbol>
  <symbol id="li-apps" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
  <symbol id="li-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 5-2 6-2 8h16c0-2-2-3-2-8m-8 12a2 2 0 0 0 4 0"/></symbol>
  <symbol id="li-terminal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m7 9 3 3-3 3m6 0h4"/></symbol>
  <symbol id="li-browser" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></symbol>
  <symbol id="li-shield" viewBox="0 0 24 24"><path d="M12 3 4 6v5c0 5 4 8 8 10 4-2 8-5 8-10V6Zm-3 9 2 2 4-4"/></symbol>
</svg>
<header class="topbar" id="topbar" data-state="full" data-hidden="false" data-style="float"></header>
<main class="stage" id="stage">
  <nav class="laptop-trail" aria-label="所在位置"><a class="back" href="/live/computer/" data-back>电脑</a><span aria-hidden="true">›</span><span aria-current="page">笔记本</span></nav>
  <section id="laptop" data-device-state="loading">
    <header class="glass laptop-hero">
      <div class="laptop-hero__info">
        <span class="laptop-hero__icon" aria-hidden="true"><svg class="laptop-icon"><use href="#li-laptop"/></svg></span>
        <div><h1>笔记本</h1><p id="laptop-state" aria-live="polite">正在读笔记本</p>
          <p id="laptop-hardware"></p><p id="laptop-system"></p></div>
      </div>
    </header>
    <dl class="laptop-metrics" id="laptop-metrics">
      <div class="glass" data-metric="battery"><dt><svg class="laptop-icon" aria-hidden="true"><use href="#li-battery"/></svg>电量</dt><dd></dd></div>
      <div class="glass" data-metric="cpu"><dt><svg class="laptop-icon" aria-hidden="true"><use href="#li-cpu"/></svg>CPU</dt><dd></dd></div>
      <div class="glass" data-metric="memory"><dt><svg class="laptop-icon" aria-hidden="true"><use href="#li-memory"/></svg>内存</dt><dd></dd></div>
      <div class="glass" data-metric="disk"><dt><svg class="laptop-icon" aria-hidden="true"><use href="#li-disk"/></svg>磁盘剩余</dt><dd></dd></div>
      <div class="glass" data-metric="network"><dt><svg class="laptop-icon" aria-hidden="true"><use href="#li-network"/></svg>网络</dt><dd></dd></div>
      <div class="glass" data-metric="remote"><dt><svg class="laptop-icon" aria-hidden="true"><use href="#li-remote"/></svg>远程连接</dt><dd></dd></div>
    </dl>
    <div class="laptop-panels">
      <section class="glass laptop-panel" aria-labelledby="laptop-apps-title">
        <header><h2 id="laptop-apps-title"><svg class="laptop-icon" aria-hidden="true"><use href="#li-apps"/></svg>正在跑的程序 <small>（按 CPU 占用）</small></h2></header>
        <table aria-labelledby="laptop-apps-title"><thead><tr><th scope="col">程序</th><th scope="col">CPU</th><th scope="col">内存</th></tr></thead><tbody id="laptop-apps"></tbody></table>
      </section>
      <section class="glass laptop-panel" aria-labelledby="laptop-notes-title">
        <header><h2 id="laptop-notes-title"><svg class="laptop-icon" aria-hidden="true"><use href="#li-bell"/></svg>需要注意</h2></header><ul class="laptop-notes" id="laptop-notes"></ul>
      </section>
    </div>
  </section>
</main>
<script src="/trust-modal/trust-modal.js"></script>
<script src="/live/_lib/live-view-switch.js"></script><script src="/live/_lib/live-client.js"></script>
<script src="/live/_lib/live-ui.js"></script><script src="/header/topbar.js"></script>
<script src="/live/_lib/live-light.js"></script><script src="/live/laptop/page.js"></script>
</body></html>
