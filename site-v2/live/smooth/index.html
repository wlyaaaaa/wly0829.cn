<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>卡顿和帧率 · 实况</title>
<link rel="stylesheet" href="/header/topbar.css">
<link rel="stylesheet" href="/connect-auth/glass.css">
<link rel="stylesheet" href="/trust-modal/trust-modal.css">
<link rel="stylesheet" href="/live/_lib/live.css">
<link rel="stylesheet" href="/live/_lib/live-page.css">
<link rel="stylesheet" href="/live/_lib/live-viz.css">
<link rel="stylesheet" href="/motion/motion.css">
<style>
.page--smooth { --col: min(1360px, calc(100vw - 84px)); }
.page--smooth #hero .card__glass { min-height: clamp(275px, 34.9vw, 500px); display: flex; padding-top: clamp(36px, 4.6vw, 68px); padding-bottom: clamp(24px, 4vw, 58px); }
.page--smooth #hero .card__glass, .page--smooth .grp .card__glass { background-image: linear-gradient(110deg, rgb(255 251 245 / .15) 25%, rgb(247 211 240 / .28) 90%); }
.page--smooth #hero .card__body { display: flex; flex: 1; flex-direction: column; padding-right: calc(var(--win) * .66); }
.page--smooth #hero .head__lead { font-size: clamp(27px, 3.35vw, 48px); line-height: 1.2; }
.page--smooth #hero .card__head { display: block; position: relative; padding-left: var(--gut); }
.page--smooth #hero .card__head > .lamp { position: absolute; top: 0; left: 0; }
.page--smooth #hero .head__cutoff { margin-left: 0; }
.smooth-headline { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 20px; overflow: clip; }
.page--smooth #hero .head__tail { position: relative; min-width: 0; font-size: clamp(15px, 1.28vw, 19px); font-weight: 650; }
/* 换行后分隔点落在标题左边界之外，整句从文字起头。 */
.page--smooth #hero .head__tail::before { content: '·'; position: absolute; right: calc(100% + 7px); }
.page--smooth #hero .hero__count { margin-top: clamp(12px, 3vw, 42px); color: var(--ink); font-size: clamp(16px, 1.68vw, 24px); }
.page--smooth #hero .hero__note { margin-top: 8px; color: #9a4d18; }
.page--smooth #hero .hero__links { margin-top: auto; padding-top: 18px; }
.page--smooth #hero .hero__links .more { font-size: clamp(16px, 1.25vw, 19px); }
.page--smooth .l2-nav--data > span { color: var(--ink-soft); font-size: 15px; }
.page--smooth .vz-board { gap: 24px; }
.page--smooth .grp[data-pic] { --win: clamp(110px, 15vw, 230px); }
.page--smooth .grp.is-open .card__body { padding-right: calc(var(--win) * .7); }
.page--smooth .grp .grp__head { grid-template-columns: 0 minmax(0,1fr) 0 88px; padding: 28px 22px 8px 36px; column-gap: 0; }
.page--smooth .grp[data-key="stutters"] .grp__head { grid-template-columns: 26px minmax(0,1fr) 0 88px; gap: 12px; }
.page--smooth .grp[data-key="stutters"] .grp__body { container-type: inline-size; }
.page--smooth .grp .grp__name { font-size: clamp(21px, 2.25vw, 32px); line-height: 1.28; }
.page--smooth .grp .grp__chapter { padding: 18px 22px 28px 36px; }
.page--smooth .grp__status { display: none; }
.page--smooth .grp__cutoff { max-width: none; margin-left: 0; }
.page--smooth .grp .grp__line:not(:has(.grp__said:not(:empty),.grp__status:not(:empty),.grp__cutoff:not(:empty))) { display: none; }
.stutter-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px 26px; align-items: start; }
.page--smooth [data-key="stutters"] .grp__chapter:has([data-x="graphs"]:not([hidden])) { padding-top: 10px; padding-bottom: 20px; }
.stutter-layout > footer { grid-column: 1 / -1; }
.stutter-layout .vz-tl__row { grid-template-columns: 0 minmax(0, 1fr); gap: 0; }
.stutter-layout .vz-tl__label, .stutter-layout .vz-legend, .frame-sync .vz-legend { display: none; }
.stutter-layout .vz-moment__hit { padding-block: 9px; }
.stutter-layout .smooth-more-moments { margin-left: 82px; }
.stutter-layout .stat-gap { margin: 0; }
.stutter-layout .vz-bars { --chart-h: clamp(126px, 11.8vw, 170px); padding-top: 12px; border-top: 1px solid rgb(40 35 30 / .09); }
.stutter-layout .chart__name, .frame-sync > .grp-split__k { font-size: 17px; font-weight: 650; color: var(--ink); }
.stutter-layout .vz-bars:not(:has(.vz-bars__hl.is-on)) .chart__vals { visibility: hidden; }
.smooth-legend { display: flex; flex-wrap: wrap; column-gap: 24px; margin: 6px 0 12px; padding: 0; list-style: none; }
.smooth-legend li::before { content: ''; display: inline-block; width: 9px; height: 9px; margin-right: 8px; border-radius: 50%; background: var(--swatch); }
.page--smooth [data-key="fps"] { --frame-chart: calc((100% - 24px) * .74); }
.page--smooth [data-key="fps"] .grp__main { grid-template-columns: minmax(0,var(--frame-chart)) minmax(0,1fr); gap: 8px 24px; }
.page--smooth [data-key="fps"] .grp__lead { display: contents; }
.page--smooth [data-key="fps"] .grp__say { grid-column: 1 / -1; margin-bottom: 6px; }
.page--smooth [data-key="fps"] .grp__hero { grid-column: 1; }
.page--smooth [data-key="fps"] .grp__hero.chart:not(.is-pointing) .chart__val:has(.chart__label) b { display: none; }
.page--smooth [data-key="fps"] .grp__chips .vz-chips { grid-template-columns: minmax(0,1fr); gap: 10px; }
.page--smooth [data-key="fps"] .grp__chips:not(:empty)::after { content: '点小图，换到左边大图'; display: block; margin: 8px 0 0 8px; color: var(--ink-soft); font-size: 13px; }
.page--smooth [data-key="fps"] .grp__main:has(.grp__chips:empty), .page--smooth [data-key="fps"].fps-single .grp__main { grid-template-columns: minmax(0,1fr); }
.page--smooth [data-key="fps"].fps-empty .grp__main { display: none; }
.page--smooth [data-key="fps"].fps-single { --frame-chart: 100%; }
.frame-sync { width: var(--frame-chart); }
.frame-sync .vz-tl__row { grid-template-columns: 58px minmax(0,1fr); gap: 0; } /* 与大图左轴一致 */
.smooth-sync-cursor { position: absolute; inset: 0 auto 0 0; border-left: 1px solid #79756c; pointer-events: none; }
.frame-sync .vz-tl__label { font-size: 11px; }
.frame-sync .vz-tl__row[data-row="day"] .vz-tl__plot { height: 15px; }
.smooth-frame-sources { margin-left: 58px; }
.smooth-frame-sources > div { display: flex; }
.smooth-frame-sources span { box-sizing: border-box; flex: none; padding-inline: 3px; text-align: center; overflow-wrap: anywhere; color: #5b5752; font-size: 12px; line-height: 16px; }
.smooth-term { white-space: nowrap; }
.smooth-frame-sources span[data-game] { color: #007b3b; }
.smooth-frame-notes { margin: 12px 0 0; color: #4a4944; font-size: 14px; line-height: 1.7; }
.page--smooth [data-key="apps"] .grp-split { grid-template-columns: minmax(0,1fr); gap: 22px; }
.page--smooth [data-key="apps"] :is(.vz-rank__label,.vz-rank__name small) { overflow: visible; white-space: normal; }
.page--smooth [data-key="apps"] .vz-rank__name { display: grid; gap: 1px; font-size: 17px; }
.page--smooth [data-key="apps"] .vz-rank__name small { display: block; margin: 2px 0 0; }
#how-measured { scroll-margin-top: 88px; }
.smooth-method { margin: 0; }
.smooth-method > div { display: grid; grid-template-columns: minmax(135px,20%) minmax(0,1fr); gap: 12px; padding: 18px 0; }
.smooth-method > div + div { border-top: 1px solid rgb(40 35 30 / .09); }
.smooth-method dt { font-size: 17px; font-weight: 650; }
.smooth-method dd { margin: 0; color: var(--ink); font-size: 16px; line-height: 1.65; }
.smooth-method dd :is(p,ul) { margin: 0; }
.smooth-method dd ul { padding-left: 1.35em; }
@container (min-width: 605px) {
  .stutter-layout:has(.vz-moment__hit) { grid-template-columns: minmax(225px,.75fr) minmax(0,1.25fr); }
  .stutter-layout:has(.vz-moment__hit) > [data-x="moments"] { border-right: 1px solid rgb(40 35 30 / .09); padding-right: 13px; }
}
</style>
<script src="/motion/motion.js"></script>
</head>
<body class="page page--live page--l2 page--data page--smooth">
<header class="topbar" id="topbar" data-state="full" data-hidden="false" data-style="float"></header>
<main class="stage" id="stage">
  <div class="field" aria-hidden="true"></div>
  <a class="back" href="/live/computer/" data-back data-mo-rise>电脑</a>
  <ul class="notices" id="notices" aria-live="polite"></ul>
  <article class="card card--hero card--quiet" id="hero" data-pic="right" data-tone="none" data-mo-rise style="--pic-y:52%">
    <div class="card__glow" aria-hidden="true"></div>
    <img class="card__tint" src="/live/img/head-smooth.webp" alt="" aria-hidden="true">
    <div class="card__glass glass">
      <span class="card__pic" aria-hidden="true"><img src="/live/img/head-smooth.webp" width="1000" height="1000" alt=""></span>
      <div class="card__body">
        <p class="card__head" data-part="head"><span class="head__lead">正在读</span></p>
        <p class="hero__count" data-part="count" hidden></p>
        <p class="hero__note" data-part="note" hidden></p>
        <div class="hero__links" data-part="links"><a class="more more--link" href="/live/computer/">电脑 <span class="more__chev">›</span></a></div>
      </div>
    </div>
  </article>
  <nav class="l2-nav l2-nav--data" aria-label="看各组"><span id="smooth-thresholds"></span></nav>
  <section class="vz-board" id="board" data-mo-rise aria-label="卡顿和帧率各组"></section>
</main>
<script src="/trust-modal/trust-modal.js"></script>
<script src="/live/_lib/live-view-switch.js"></script><script src="/live/_lib/live-client.js"></script>
<script src="/live/_lib/live-ui.js"></script>
<script src="/header/topbar.js"></script>
<script src="/live/_lib/live-light.js"></script>
<script src="/live/_lib/live-chart.js"></script>
<script src="/live/_lib/live-viz.js"></script>
<script src="/live/_lib/live-stat.js"></script>
<script src="/live/smooth/detail.js"></script>
<script src="/live/smooth/page.js"></script>
</body>
</html>
