<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=1440"><title>AI 对话 · 实况</title>
<link rel="stylesheet" href="/header/topbar.css"><link rel="stylesheet" href="/connect-auth/glass.css"><link rel="stylesheet" href="/trust-modal/trust-modal.css">
<link rel="stylesheet" href="/live/_lib/live.css"><link rel="stylesheet" href="/live/_lib/live-page.css"><link rel="stylesheet" href="/motion/motion.css"><script src="/motion/motion.js"></script>
<link rel="stylesheet" href="/live/_lib/live-viz.css"><link rel="stylesheet" href="/live/_lib/live-board.css"><link rel="stylesheet" href="/live/chats/stats.css">
<style>.helper{flex-wrap:wrap}.helper__who,.helper__at,[data-steady]{white-space:nowrap}.row__acts{margin-left:auto}.chat-ended-label{margin:12px 0 4px;list-style:none}.chat-ended-label h3{margin:0;font-size:14px;color:var(--ink-soft)}#recent:not(:has(> .lb-fold.is-open)) #recent-list > .chat-ended-extra{display:none}#recent-list > .chat-ended-extra{transition:opacity calc(200ms * var(--sp)) ease calc(120ms * var(--sp))}@starting-style{#recent-list > .chat-ended-extra{opacity:0}}</style>
<style>
/* 下半截：分组看板（_lib/live-board.*），比上半截宽，左右伸到和自动任务页一样宽 */
.page--chats .chat-lower { --wide: min(1856px, calc(100vw - 64px)); margin: 34px calc((var(--col) - var(--wide)) / 2) 0; }
.page--chats .chat-lower { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; align-items: start; }
/* 近 72 小时已结束占整行，排成几列，每列不窄于 400px（M534） */
.page--chats #recent-list { grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 7px 12px; }
.page--chats #recent-list > :is(.chat-ended-label, .row--empty) { grid-column: 1 / -1; }
.page--chats #recent-list > .lb-item { align-content: start; }
.page--chats #active > .part { margin: 0 0 12px 2px; }
.page--chats #active > .live-fallback-note { margin: 8px 0 0 80px; }   /* 在干那块的旧数说明和卡里的字对齐，不贴到卡外左边（r83 返修） */
.chat-board .lb-card__head { min-height: 80px; padding-block: 10px; }
.chat-board .lb-card--items .lb-rows { gap: 7px; }
.chat-board .lb-card--items .lb-rows > .lb-item { padding-block: 8px; }
.chat-board .chat-context { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 10px; }
.chat-board .row__text [data-steady] { white-space: normal; overflow-wrap: anywhere; }
.chat-board .lb-item :is(.row__line, .chat-think, .helpers) { margin-top: 3px; }
.chat-board .helper { line-height: 19px; }
.page--chats .lb-card[data-key="waiting"]:not(.lb-card--quiet) { border: 1px solid #00A650; }
.page--chats .lb-card--quiet > .lb-rows:first-of-type { flex: 1; grid-template-rows: minmax(0, 1fr) auto minmax(0, 2fr); }
.page--chats .lb-rows > .chat-idle { grid-row: 2; display: grid; justify-items: center; gap: 14px; padding: 28px 16px; text-align: center; }
.page--chats .chat-idle__mark { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 50%; background: rgb(0 166 80 / .07); box-shadow: inset 0 0 0 1px rgb(0 166 80 / .18); color: #00A650; }
.page--chats .chat-idle__mark .lb-ico { width: 30px; height: 30px; fill-opacity: 0; }
.page--chats .chat-idle > b { font-size: 15px; line-height: 22px; font-weight: 500; letter-spacing: .04em; color: #5f5d57; }
/* 每栏卡头的插画（画风变量：对清以后换图只改这里；暂时借自动任务页的画） */
.page--chats .lb-card[data-art="running"] { --lb-art: url("/live/img/chats-col-running.webp"); }
.page--chats .lb-card[data-art="waiting"] { --lb-art: url("/live/img/chats-col-waiting.webp"); }
.page--chats .lb-card[data-art="queued"] { --lb-art: url("/live/img/chats-col-queued.webp"); }
.page--chats .lb-card[data-art="done"] { --lb-art: url("/live/img/chats-col-done.webp"); }
/* 一小张对话卡：名字后面跟“第几步”“帮手几个”两颗小药丸，下面型号、步骤条、最新进展、思考摘要、帮手 */
.page--chats .lb-item .row__main { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
.page--chats .lb-item .row__title { font-size: 15px; line-height: 22px; }
/* 对话名只在空格和标点处折行，连着的中文不从中间断开；一段长过整行才硬断（M743，同实况首页 AI 对话卡） */
.page--chats .row__title { word-break: keep-all; overflow-wrap: break-word; }
.page--chats .chat-pill { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 999px; background: rgb(255 255 255 / .7); box-shadow: inset 0 0 0 1px rgb(20 20 19 / .07); font-size: 12px; font-weight: 400; letter-spacing: .03em; color: var(--muted); white-space: nowrap; }
.page--chats .chat-steps { display: flex; gap: 3px; height: 5px; margin: 8px 0 2px; max-width: 260px; }
.page--chats .chat-steps > i { flex: 1; border-radius: 3px; background: rgb(20 20 19 / .08); }
.page--chats .chat-steps > i:is([data-status="completed"],[data-status="done"]) { background: rgb(var(--glow-green) / .75); }
.page--chats .chat-steps > i[data-status="in_progress"], .page--chats .chat-steps > i[data-status="running"] { background: #9db8e8; }
.page--chats .chat-steps--fill { display: block; border-radius: 3px; background: rgb(20 20 19 / .08); overflow: hidden; }
.page--chats .chat-steps--fill > i { display: block; height: 100%; border-radius: 3px; background: #7cc49a; }
.page--chats .lb-item > .row__text > .row__line { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.page--chats .chat-pill--link { text-decoration: underline; text-underline-offset: 2px; }
.page--chats .chat-think { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 8px; align-items: center; margin: 4px 0 0; }
.chat-think__preview { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-think .chat-think__toggle { margin: 0; height: 24px; translate: none; color: #00813f; background: rgb(0 166 80 / .07); }
.chat-think .chat-think__toggle:is(:hover, [aria-expanded="true"]) { background: rgb(0 166 80 / .14); }
.chat-think__full { grid-column: 1 / -1; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.chat-think__shut, .chat-think__full,
.chat-think__toggle[aria-expanded="true"] .chat-think__open,
.chat-think:has(> [aria-expanded="true"]) .chat-think__excerpt { display: none; }
.chat-think__toggle[aria-expanded="true"] .chat-think__shut { display: inline; }
.chat-think__toggle[aria-expanded="true"] + .chat-think__full { display: block; }
.page--chats .chat-think--fits > .chat-think__toggle { display: none; }
.page--chats .lb-item .helpers { margin-top: 8px; }
.page--chats .lb-card__note { margin: 0 22px 14px; }
/* 页头卡、三家额度那一排、统计卡、最下面“近 30 天”那张跟中间四栏一样宽（四栏有意跟自动任务页一样宽，不动；主控 11-26 06:15 记的老毛病）；只改宽度，卡里的排法不动 */
.page--chats :is(#hero, #chat-quota, .chat-stats) { --wide: min(1856px, calc(100vw - 64px)); margin-inline: calc((var(--col) - var(--wide)) / 2); }
/* 加绿（本人 11-26 00:14 点头 GREENIMG1126 选 A，照 G-AI对话-v6）：只加颜色，版式和字不动。
   “今天”“近 7 天”“在干”“等你”前一根绿竖条；今天、近 7 天的对话数和帮手数绿；在干、等你两栏里“问情况”“打开对话”“看完整对话”绿字绿边白底（照本人给的那颗），
   历时、帮手数、第几步的数字绿。“停下了，没归档”（状态不明在这一栏）和“做完了 · 已归档”不加绿；对话标题前只留空心圈；进度条照旧 */
.page--chats .chat-counts h2 { display: flex; align-items: center; gap: 9px; }
.page--chats .chat-counts h2::before, .page--chats .lb-card:is([data-key="running"], [data-key="waiting"]) .lb-card__title::before { content: ""; flex: none; align-self: center; width: 5px; height: 18px; border-radius: 3px; background: #00A650; }
.page--chats .lb-card:is([data-key="running"], [data-key="waiting"]) .lb-card__title::before { height: 22px; margin-right: -2px; }
.page--chats .chat-counts > div > p:first-of-type > strong { color: #00A650; }
.page--chats .lb-card:is([data-key="running"], [data-key="waiting"]) :is(.row__acts .btn, .chat-detail-link) { border-color: #00A650; background: #fff; color: #00A650; font-weight: 600; }
.page--chats .lb-card:is([data-key="running"], [data-key="waiting"]) :is(.row__acts .btn, .chat-detail-link):is(:hover, :focus-visible) { border-color: #008a43; background: rgb(0 166 80 / .07); color: #008a43; }
.page--chats .lb-card:is([data-key="running"], [data-key="waiting"]) .chat-green { color: #00A650; font-weight: 600; }
</style>
<link rel="stylesheet" href="/live/chats/draw10.css">
</head>
<body class="page page--live page--l2 page--chats">
<header class="topbar" id="topbar" data-state="full" data-hidden="false" data-style="float"></header>
<main class="stage" id="stage">
<div class="field" aria-hidden="true"></div><a class="back" href="/live/#chats" data-back data-mo-rise>实况</a>
<ul class="notices" id="notices" aria-live="polite"></ul>
<article class="card card--hero" id="hero" data-pic="right" data-mo-rise>
<div class="card__glow" aria-hidden="true"></div><img class="card__tint" src="/live/img/chats.webp" alt="" aria-hidden="true">
<div class="card__glass glass"><span class="card__pic" aria-hidden="true"><img src="/live/img/chats.webp" width="1000" height="1000" alt=""></span>
<div class="card__body"><p class="card__head" id="head"><span class="lamp" aria-hidden="true"></span><span class="head__lead">AI 对话</span></p><p class="hero__note row__sub" id="chat-note">正在读</p>
<p class="hero__note row__sub" id="chat-background" hidden></p>
<div id="chat-sources"></div>
<div class="hero__links"><a class="more more--link" href="#active">看各列对话 ›</a><a class="more more--link" href="#recent">72 小时内已结束的 ›</a></div></div></div>
</article>
<section class="card chat-stats" aria-label="对话统计"><div class="card__glass glass"><div class="card__body">
<div id="chat-counts" class="chat-counts"></div>
<div class="chat-plots"><div><p class="part">近 7 天 · 同时有几个 AI 在干活（含帮手）</p><div id="chat-concurrent"></div><div id="chat-current-reading" class="row__sub" hidden></div><p class="chat-end-date" id="chat-end-date"></p></div><div><p class="part">每天开了几个对话</p><div id="chat-days"></div></div></div>
</div></div></section>
<div class="chat-lower" data-mo-rise>
<section id="active"><p class="part l2-part" hidden>全部在干的、等着的</p><div class="chat-board" id="chat-board"></div></section>
<div class="chat-board" id="chat-recent-board"></div>
</div>
</main>
