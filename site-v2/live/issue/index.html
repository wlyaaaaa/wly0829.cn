<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>账本一件 · 实况</title>
<link rel="stylesheet" href="/header/topbar.css">
<link rel="stylesheet" href="/connect-auth/glass.css">
<link rel="stylesheet" href="/trust-modal/trust-modal.css">
<link rel="stylesheet" href="/live/_lib/live.css">
<link rel="stylesheet" href="/live/_lib/live-page.css">
<link rel="stylesheet" href="/live/_lib/live-record.css">
<link rel="stylesheet" href="/live/_lib/live-dossier.css">
<link rel="stylesheet" href="/live/issue/issue.css">
<link rel="stylesheet" href="/motion/motion.css">
<script src="/motion/motion.js"></script>
</head>
<body class="page page--live page--l3" data-record="issue">
<header class="topbar" id="topbar" data-state="full" data-hidden="false" data-style="float"></header>
<main class="stage dossier" id="stage">
  <div class="field" aria-hidden="true"></div>
  <nav class="iss-crumb" aria-label="当前位置" data-mo-rise><a href="/live/#ledger">实况</a><a class="back" href="/live/ledger/" data-back>AI 自动任务账本</a><strong aria-current="page">这件</strong></nav>
  <ul class="notices" id="notices" aria-live="polite"></ul>
  <article class="card card--record dossier__hero iss-hero" id="hero" data-tone="off" data-pic="right" data-mo-rise>
    <div class="card__glow" aria-hidden="true"></div>
    <img class="card__tint" src="/live/img/dossier-issue-v1.webp" alt="" aria-hidden="true">
    <div class="card__glass glass">
      <span class="card__pic" aria-hidden="true"><img src="/live/img/dossier-issue-v1.webp" width="1000" height="1000" alt=""></span>
      <div class="card__body">
        <p class="card__head" data-part="head"></p>
        <p class="iss-state" data-part="state" hidden></p>
        <p class="iss-src" data-part="src" hidden></p>
      </div>
    </div>
  </article>
  <div class="iss-rest" id="rest">
    <div class="iss-three" id="three" data-mo-rise></div>
    <div class="dossier__grid iss-grid" id="grid" data-shape="two">
      <div class="dossier__main">
        <section class="dossier-card glass iss-looks" id="looks" data-mo-rise hidden>
          <h2 class="dossier-card__title"><span class="dossier-icon" data-icon="clock" aria-hidden="true"></span>每看一次</h2>
          <ol class="runs" id="steps"></ol>
          <p class="iss-foot" id="steps-foot" hidden></p>
        </section>
      </div>
      <aside class="dossier__side" id="side"></aside>
    </div>
  </div>
</main>
<script src="/trust-modal/trust-modal.js"></script>
<script src="/live/_lib/live-view-switch.js"></script><script src="/live/_lib/live-client.js"></script>
<script src="/live/_lib/live-ui.js"></script>
<script src="/header/topbar.js"></script>
<script src="/live/_lib/live-light.js"></script>
<script src="/live/_lib/live-runs.js"></script>
<script src="/live/automation/presentation.js"></script>
<script src="/live/issue/page.js"></script>
</body>
</html>
