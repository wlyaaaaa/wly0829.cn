<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>项目 · 实况</title>
<link rel="stylesheet" href="/header/topbar.css">
<link rel="stylesheet" href="/connect-auth/glass.css">
<link rel="stylesheet" href="/trust-modal/trust-modal.css">
<link rel="stylesheet" href="/live/_lib/live.css">
<link rel="stylesheet" href="/live/_lib/live-page.css">
<link rel="stylesheet" href="/live/_lib/live-project-look.css"><link rel="stylesheet" href="/live/_lib/live-viz.css">
<link rel="stylesheet" href="/live/project/look.css">
<link rel="stylesheet" href="/live/project/finance.css">
<link rel="stylesheet" href="/motion/motion.css">
<script src="/motion/motion.js"></script>
<style>
.pj-list-group { list-style:none; min-width:0; }
</style>
</head>
<body class="page page--live page--l2 page--project">

<header class="topbar" id="topbar" data-state="full" data-hidden="false" data-style="float"></header>

<!-- 第二层：一个项目（47 个项目共用这一套排版，每个项目自己的底色）。
     页头：项目名＋日用／偶用／冻结小标签＋（问情况、项目介绍）；一行“最近改动 · 一句话说明”，详情收在“详情 ›”里；项目的画在一侧。
     页头下面一条关键数字（代表数、近 7 天影响改动、名下任务／技能、等你的、最近产物、有多大），能点的点进去。
     再下面两栏卡片：一段一张卡，右上角“看全部 ›”；两栏按高度摆齐；没有的块不出卡。 -->
<main class="stage" id="stage">
  <div class="field" aria-hidden="true"></div>

  <a class="back" href="/live/projects/" data-back data-mo-rise>返回项目列表</a>

  <ul class="notices" id="notices" aria-live="polite"></ul>

  <article class="card card--hero card--project" id="pj-hero" data-pic="right" data-tone="none" data-mo-rise hidden style="--pic-y: 46%">
    <div class="card__glow" aria-hidden="true"></div>
    <img class="card__tint" alt="" aria-hidden="true">
    <div class="card__glass glass">
      <span class="card__pic" aria-hidden="true"><img width="1000" height="1000" alt=""></span>
      <div class="card__body">
        <div class="pj-title">
          <p class="card__head" data-part="head"></p>
          <div class="pj-hero-acts" data-part="acts" hidden></div>
        </div>
        <div class="pj-line">
          <p class="hero__note" data-part="about" hidden></p>
          <button class="more pj-detail-btn" type="button" data-part="detail" aria-expanded="false" hidden>详情 <span class="more__chev">›</span></button>
        </div>
        <div class="fold pj-hero-fold" data-part="factsbox"><div><dl class="kv pj-facts" data-part="facts" hidden></dl></div></div>
      </div>
    </div>
  </article>

  <div class="pj-strip glass" data-part="links" hidden></div>

  <div class="l2-board pj-board" id="pj-board">
    <section class="l2-col" id="pj-main" data-mo-rise hidden></section>
    <section class="l2-col" id="pj-side" data-mo-rise hidden></section>
  </div>
</main>

<script src="/trust-modal/trust-modal.js"></script>
<script src="/live/_lib/live-view-switch.js"></script><script src="/live/_lib/live-client.js"></script>
<script src="/live/_lib/live-ui.js"></script>
<script src="/header/topbar.js"></script>
<script src="/live/_lib/live-light.js"></script>
<script src="/live/_lib/live-chart.js"></script><script src="/live/_lib/live-viz.js"></script><script src="/live/_lib/live-project-viz.js"></script><script src="/live/_lib/live-project-look.js"></script><script src="/live/project/layout.js"></script><script src="/live/project/additions.js"></script><script src="/live/project/site-readings.js"></script><script src="/live/project/finance.js"></script><script src="/live/project/page.js"></script>
</body>
</html>
