/* 窗口窄到读数那一栏快挤没了（如 1024 宽）：每行名字放上一行，读数占整行，不伸出卡外（M415、M515） */

.page--live #automation .automation-preview-detail b { white-space: nowrap; }

.page--live #automation[data-auto-state] .task-preview .auto-a-row { align-items: start; padding-block: 10px; border-bottom: 1px solid var(--hair); }
.page--live #automation[data-auto-state] .task-preview .auto-a-row:last-child { border-bottom: 0; }
.page--live #automation .auto-a-row > .lamp, .page--live #automation .auto-a-row > .auto-row-gap { align-self: start; margin-top: 9px; }
.page--live #automation .auto-a-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin: 0; font-size: 16px; line-height: 26px; }

.page--live #phone .head__lead { white-space: nowrap; font-size: clamp(24px, 1.75vw, 34px); }
.page--live .board .row__title { word-break: normal; }
/* 等你的事、AI 对话两张卡的标题：只在空格和标点处折行，连着的中文不从中间断开（“解锁”不拆成“解／锁”）；一段长过整行才硬断（M743） */
.page--live .board :is(#needs, #chats) .row__title { word-break: keep-all; overflow-wrap: break-word; }
.page--live .board .row__title .l1-unit { display: inline; white-space: nowrap; }
.page--live .board .row.is-expanded > .row__text > .helpers { display: none; }
.page--live #chats .row--chat > .row__text { display: contents; }
.page--live #chats .row--chat .row__main { grid-column: 2; grid-row: 1; }
.page--live #chats .row--chat > .row__acts { grid-row: 1; }
.page--live #chats .row--chat > .row__text > :is(.row__line,.row__sub,.helpers,.row__detail) { grid-column: 2 / -1; }
.page--live .l1-helper { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
.page--live .l1-helper > span:first-child { min-width: 0; }
.page--live .l1-helper .row__acts { flex-shrink: 0; margin-left: auto; }
.page--live .l1-options { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.page--live #needs .row__sub, .page--live #chats [data-steady] { text-wrap: pretty; }
.page--live #backups .head__tail { text-wrap: pretty; }
.live-unreadable .board { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.live-unreadable .board__col { display: contents; }
.live-unreadable .board__wide { grid-column: auto; }
.page--live.live-unreadable .board .card .card__glass { min-height: 0; padding: 14px 20px; }
.live-unreadable .card__body { padding: 0 !important; }

.page--live.live-unreadable .board .card[data-pic="right"] .card__body { padding-right: calc(var(--win) * .6) !important; }
.live-unreadable .card__body > :not([data-part="head"]):not([data-part="status"]) { display: none !important; }
.page--live.live-unreadable .board .card .card__head, .live-unreadable #phone .card__head { display: flex; margin: 0; padding: 0; border: 0; align-items: center; }
.page--live.live-unreadable .board .card .card__head > .lamp, .live-unreadable #phone .card__head > .lamp { position: relative; inset: auto; width: 12px; height: 12px; flex: 0 0 12px; margin: 0; align-self: center; }
.live-unreadable .head__lead { font-family: var(--sans); font-size: 18px; font-weight: 600; line-height: 26px; color: var(--ink-soft); }
.page--live.live-unreadable #phone .head__lead { font-size: 18px; }
.l1-unreadable-note { font-size: 17px; line-height: 26px; color: var(--ink-soft); }
.page--live.live-unreadable #ledger [data-part="head"] > .row__sub { flex-basis: auto; margin-left: 0; }
.page--live.live-unreadable .topbar .live-at { background: none; border-color: transparent; box-shadow: none; color: var(--muted); cursor: default; }
.page--live.live-unreadable .topbar .live-at::before { display: none; }

.page--live :is(#needs,#chats,#tasks,#backups,#ledger) .row { padding: 6px 0; }
.page--live :is(#needs,#chats,#tasks,#backups,#ledger) .row__text { display: block; min-width: 0; overflow: hidden; }
.page--live :is(#needs,#chats,#tasks,#backups,#ledger) .row__text { white-space: nowrap; text-overflow: ellipsis; }
.page--live #chats .row--chat > .row__text { display: block; grid-column: 2; grid-row: 1; }
.page--live :is(#needs,#chats,#tasks,#backups,#ledger,#projects) .head__link { min-width: 0; max-width: 100%; row-gap: 2px; }
.page--live :is(#needs,#chats,#tasks,#backups,#ledger,#projects) :is(.head__lead,.head__tail) { min-width: 0; white-space: normal; overflow-wrap: anywhere; }
.page--live :is(#needs,#chats,#tasks,#backups,#ledger) .row__main { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.page--live :is(#needs,#chats,#tasks,#backups,#ledger) .row__main > .row__title { display: inline; }
.page--live :is(#needs,#chats,#tasks,#backups,#ledger) .row__text > :is(.row__sub,.row__line,.helpers) { display: none; }
.page--live #needs .row__text { grid-column: 2; grid-row: 1; }
.page--live #chats .row--chat .row__main { grid-column: auto; grid-row: auto; }
.page--live .card--empty .card__body > :not([data-part="head"]):not([data-part="status"]) { display: none !important; }
.page--live .card--empty .card__glass { min-height: 0; padding-block: 20px; }
.page--live .card--empty .head__lead { font: 400 15px/24px var(--sans); color: var(--muted); }
.page--live #ledger { --gut: 25px; }
.page--live :is(#needs,#chats,#tasks,#automation)[data-pic="right"] .card__body { padding-right: var(--win); }
.page--live :is(#needs,#chats) .row__acts { padding-left: 10px; }
.page--live :is(#backups,#tasks,#automation,#computer) .head__link { display: grid; grid-template-columns: minmax(0, 1fr) auto; row-gap: 2px; }
.page--live :is(#backups,#tasks,#automation,#computer) .head__tail:not(:last-child) { grid-column: 1 / -1; grid-row: 2; font-size: 13px; line-height: 20px; white-space: normal; }
.page--live :is(#backups,#tasks,#automation,#computer) .head__tail:last-child { grid-column: 2; grid-row: 1; margin-left: 0; }
.page--live :is(#backups,#tasks,#automation,#computer) .head__link { grid-template-columns: max-content minmax(0, 1fr); column-gap: 8px; }
.page--live #computer .head__tail:not(:last-child) { word-break: keep-all; overflow-wrap: anywhere; }
.page--live :is(#backups,#tasks,#automation,#computer) .head__tail:last-child { justify-self: start; }
.page--live :is(#computer .kv__row:last-child, #phone .kv__row) dt a { color: inherit; text-decoration: none; }
.page--live :is(#computer .kv__row:last-child, #phone .kv__row) dt a:hover { text-decoration: underline; }
.page--live #backups [data-part="main"] .row { grid-template-columns: var(--gut) minmax(0, max-content) auto; justify-content: start; }
.page--live #backups .row__acts { padding-left: 10px; }
.page--live #backups .row > .lamp { scale: .6; transform-origin: left center; }
.page--live #backups [data-part="restore"] .row { border-top: 1px solid var(--hair); padding: 8px 0; }
.page--live #backups [data-part="restore"] .row__sub { display: block; white-space: normal; }
.page--live :is(#computer,#phone) .kv__row { grid-template-columns: 25px 88px minmax(0, 1fr); }
.page--live #computer [data-part="why"] { margin-left: 25px; }
.page--live #computer .kv__row:last-child dd { gap: 4px 10px; }
.page--live #computer .kv__row:last-child .kv__link::after { content: none; }
.page--live #computer .kv__link > small { margin-top: 4px; text-wrap: pretty; }
.page--live #phone .card__head + [hidden] + .kv { margin-top: 12px; }
.page--live #phone .card__note:has(> .lamp) { padding-left: 18px; }
.page--live #phone .card__note > .lamp { left: 0; scale: .65; transform-origin: left center; }

.page--live #chats .row__text { white-space: normal; }
.page--live #chats .row__meta { display: block; margin-inline-start: 0; white-space: normal; }
.page--live #chats .chat-meta-part { display: inline-block; margin-right: .5em; white-space: nowrap; }
.page--live .board #chats .row__main > .row__title { display: inline-block; max-width: 100%; text-wrap: balance; }
.page--live #chats .row__text > .row__sub { display: block; white-space: normal; margin-top: 4px; }
.page--live #chats .chat-preview__text { margin: 0; white-space: pre-line; overflow-wrap: anywhere; }
.page--live #chats .chat-preview:has(> .chat-preview__toggle[aria-expanded="false"]) .chat-preview__text { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; overflow: hidden; }
.page--live #chats .chat-preview__toggle { margin: 2px 0 0; padding-inline: 0; translate: none; }
/* 首页：说明和动作分行，名牌统一高度；共享灯与光规则由共用单维护。 */
.page--live #needs .row__text:has(> .row__main) { display: contents; white-space: normal; }
.page--live #needs .row__main { grid-column: 2; grid-row: 1; }
.page--live #needs .row__text > .row__sub { display: block; white-space: normal; margin-top: 4px; }
.page--live #needs .needs-summary { margin: 12px 0 0 var(--gut); }
/* 等你的事卡每件事三行（M752，本人 11-24 16:09 点头的样子）：第一行“要本人做 ·”加标题占满整行，长了照原样折行；
   第二行按钮从左排，种类、顺序照旧；第三行原来的灰字。卡窄到一行放不下这些按钮时，按钮自己折行。
   按钮那一行（M998，本人 11-26 圈的“间距不匀、各行起点不齐”）：整张卡的几行共用一套列（去办／问情况／关掉类／晚点提醒），
   每列按这一列最宽的那颗按钮定宽，按钮之间一样留 8px；哪行没有“去办”，后面几颗照旧和别的行对成一列；整张卡都没有“去办”时那一列不占地方。
   按钮照旧是首页各卡那种白底按钮（本人 11-26 04:2x：浅灰描边在首页不明显），去办照旧绿底。 */
.page--live #needs [data-part="main"] { container-type: inline-size; display: grid; grid-template-columns: [go] auto [ask] auto [close] auto [later] auto [end] minmax(0, 1fr); }
.page--live #needs [data-part="main"] > .row { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; row-gap: 6px; align-items: start; position: relative; padding-left: var(--gut); }
.page--live #needs [data-part="main"] > .row > .lamp { position: absolute; left: 2px; top: 14px; margin: 0; }
.page--live #needs [data-part="main"] > .row .row__main { grid-column: 1 / -1; grid-row: 1; min-width: 0; }
.page--live #needs [data-part="main"] > .row > .row__acts, .page--live #needs [data-part="main"] > .row > .row__acts:has(> [data-slot]) { grid-column: 1 / -1; grid-row: 2; padding-left: 0; }
.page--live #needs [data-part="main"] > .row > .row__acts:has(> [data-slot]) { display: grid; grid-template-columns: subgrid; justify-content: start; justify-items: start; align-items: center; column-gap: 0; row-gap: 6px; max-width: none; }
.page--live #needs [data-part="main"] > .row > .row__acts > [data-slot] { grid-row: 1; margin: 0 8px 0 0; }
.page--live #needs [data-part="main"] > .row > .row__acts > [data-slot="go"] { grid-column: go; }
.page--live #needs [data-part="main"] > .row > .row__acts > [data-slot="ask"] { grid-column: ask; }
.page--live #needs [data-part="main"] > .row > .row__acts > [data-slot="close"] { grid-column: close; }
.page--live #needs [data-part="main"] > .row > .row__acts > [data-slot="later"] { grid-column: later; margin-right: 0; }
/* 别的件有绿色“去办”、这件没有时：这件的按钮不跟别的行对列，“问情况”从最左边起，后面几颗紧跟着排，间距照旧 8px（r83 返修第三轮）。
   上一轮只把每颗挪进前一列，列宽还按别的行（去办那一列按“登录脉脉”定宽），空当挪到了“问情况”和“不办了”中间，“晚点提醒”还把那一列撑宽、带去办的几行跟着右移。
   整张卡都没有去办时照旧对列（去办那一列不占地方）。 */
.page--live #needs [data-part="main"]:has(> .row > .row__acts > [data-slot="go"]) > .row > .row__acts:not(:has(> [data-slot="go"])):has(> [data-slot]) { display: flex; flex-wrap: wrap; align-items: center; row-gap: 6px; }
.page--live #needs [data-part="main"] > .row > .row__acts > [data-slot="pick"] { grid-column: end; }
.page--live #needs [data-part="main"] > .row > .row__acts > :not([data-slot]) { grid-column: 1 / -1; grid-row: 2; }
.page--live #needs [data-part="main"] > .row .row__text > :not(.row__main), .page--live #needs [data-part="main"] > .row > :not(.row__acts):not(.row__text):not(.lamp) { grid-column: 1 / -1; margin-top: 0; }
/* 卡窄到四颗按钮一行摆不下（约 320px，如 1100 宽以下的窗口）：按钮从左排、自己折行，不再对列 */
@container (max-width: 319px) {
 .page--live #needs [data-part="main"] > .row > .row__acts:has(> [data-slot]) { display: flex; flex-wrap: wrap; gap: 6px 8px; max-width: 100%; }
 .page--live #needs [data-part="main"] > .row > .row__acts > [data-slot] { margin: 0; }
}
.page--live #backups [data-part="main"] .row { grid-template-columns: var(--gut) minmax(0, 1fr) auto; }
.page--live #backups .row__title { font-weight: 400; }
.page--live:not(.live-unreadable) .card__body:has(.card__head > .lamp) > :is([data-part="status"],[data-part="gap"],[data-part="why"],.live-fallback-note,.chat-background) { margin-inline-start: 25px; }

.b6-tb__dot[data-kind="bad"], .b6-tb__dot[data-kind="late"], .b6-dot[data-kind="late"] { background: #ef8f16; }
.b6-tb__dot[data-kind="next"] { border: 2px solid #6c7370; background: #fff; }
#ledger .b6-tb__dot { width: 13px; height: 13px; }
a.b6-tb__dot::after { content: ""; position: absolute; inset: -7px; border-radius: 50%; }
a.b6-tb__dot:hover, a.b6-tb__dot:focus-visible { box-shadow: 0 0 0 4px rgb(0 166 80 / .2); outline: none; }
.b6-tb__now { position: absolute; top: 50%; width: 2px; height: 26px; translate: -50% -50%; border-radius: 2px; background: #00A650; pointer-events: none; }
.b6-tb__now b, .b6-tb__now small { position: absolute; left: 50%; translate: -50% 0; white-space: nowrap; font-size: 13px; line-height: 18px; font-weight: 600; color: #3a4642; }
.b6-tb__now b { bottom: calc(100% + 1px); }
.b6-tb__now small { top: calc(100% + 1px); font-variant-numeric: tabular-nums; }
.b6-lg-list { margin: 4px 0 8px; }
.b6-lg-item { position: relative; margin: 9px 0; }
.page--live .b6-lg-item > .b6-dot { position: absolute; left: -25px; top: .5em; margin: 0; }
.b6-body .b6-lg-item > p { margin: 0; font-size: 15px; line-height: 1.45; }
.b6-lg-item > small { display: block; margin-top: 1px; }
.b6-body p.b6-lg-none { margin: 8px 0 10px; }
.b6-lg-foot b { color: #0a532b; }
</style>
</head>
